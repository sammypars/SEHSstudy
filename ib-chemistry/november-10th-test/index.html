<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../../device.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IB Chemistry: November 10th Test</title>
<meta name="description" content="IB Chemistry review: the mole, percent composition, empirical and molecular formulas. Study guide, practice questions, written problems, flashcards and the November 10th Test.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --sunk:#E6EDEE; --ink:#16201F; --muted:#5B6866; --line:#D5DFDF;
  --accent:#0B7A80; --accent-ink:#FFFFFF; --accent-soft:#D9EFF0; --grid:rgba(11,122,128,.06);
  --good:#1E7041; --good-soft:#E2F2E7; --bad:#B42318; --bad-soft:#FBE8E5;
  --f-display:"Fraunces",Georgia,serif; --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101414; --surface:#182020; --sunk:#222C2C; --ink:#E8EEED; --muted:#9FADAB; --line:#2E3A3A;
  --accent:#5CC8D0; --accent-ink:#06191A; --accent-soft:#16393B; --grid:rgba(92,200,208,.05);
  --good:#5CCB8A; --good-soft:#15291D; --bad:#F2867A; --bad-soft:#331A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101414; --surface:#182020; --sunk:#222C2C; --ink:#E8EEED; --muted:#9FADAB; --line:#2E3A3A;
  --accent:#5CC8D0; --accent-ink:#06191A; --accent-soft:#16393B; --grid:rgba(92,200,208,.05);
  --good:#5CCB8A; --good-soft:#15291D; --bad:#F2867A; --bad-soft:#331A17; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em;font-weight:650}
h1{font-size:clamp(28px,4.2vw,42px);font-weight:800} h2{font-size:23px} h3{font-size:18px}
p{margin:0} a{color:var(--accent)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;padding:0 10px 4px;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;font-weight:400;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.navgroup{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 10px 4px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
.nav a:hover{background:var(--sunk)} .nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.railhome{padding:0 10px 14px} .railsheet{padding:12px 10px 0}
.rail-foot{margin-top:auto;padding:10px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.main{padding-block:36px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.lede{color:var(--muted);max-width:64ch;font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)} .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)} .btn.small{padding:6px 12px;font-size:13.5px} .btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13.5px}
.themebtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.test-card{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px}
.test-card .eyebrow{color:inherit;opacity:.8} .test-card .count{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}
.test-card .btn{background:var(--surface);color:var(--ink);border-color:var(--surface);align-self:flex-start}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px} .info dt{color:var(--muted)} .info dd{margin:0;font-weight:600}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{display:flex;flex-direction:column;gap:3px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink);min-width:0}
.mode:hover{border-color:var(--accent)} .mode b{font-size:15.5px} .mode span{font-size:13.5px;color:var(--muted)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.topic{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.topic:hover{border-color:var(--accent)} .topic .n{font-weight:600;font-size:15px;line-height:1.3}
.bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden} .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.topic .s{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:30px;padding:7px 14px;cursor:pointer;font-size:14.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:650}
.seg{align-self:flex-start;display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer;font-family:var(--f-mono);font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0} .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.label{font-weight:650;font-size:14.5px;margin-bottom:8px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.progress{flex:1;min-width:120px;height:4px;background:var(--sunk);border-radius:4px;overflow:hidden} .progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtag{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.qtext{font-size:19px;font-weight:500;line-height:1.55;max-width:70ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer;font-size:17px;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)} .opt .l{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted);flex:none;margin-top:3px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt:disabled{cursor:default}
.fb{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px} .fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b.t{font-weight:700} .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.guide-sec{display:flex;flex-direction:column;gap:10px} .guide-sec p,.guide-sec li{max-width:70ch} .guide-sec ul,.guide-sec ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.nt{border-collapse:collapse;font-size:15px;max-width:100%} .nt th,.nt td{border:1px solid var(--line);padding:7px 12px;text-align:left} .nt th{background:var(--sunk)}
.tip{background:var(--accent-soft);border-radius:8px;padding:10px 14px}
details.wp{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)} details.wp summary{cursor:pointer;padding:14px 16px;font-weight:650;list-style:none}
details.wp summary::-webkit-details-marker{display:none} details.wp .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.sol{background:var(--sunk);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:6px} .sol .a{font-weight:700;color:var(--accent)}
.flash{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:30px;cursor:pointer;user-select:none}
.flash .p{font-family:var(--f-display);font-size:26px;font-weight:650} .flash .ans{font-size:20px;max-width:46ch}
.score{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:22px;max-width:640px;width:calc(100% - 32px);max-height:85vh}
dialog::backdrop{background:rgba(0,0,0,.45)} dialog h3{margin:14px 0 6px} dialog table{width:100%}
.toprail{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr} .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;padding:12px;gap:2px}
  .navgroup,.rail-foot,.brand small{display:none} .brand{width:100%} .nav{display:flex;flex-wrap:wrap;gap:2px} .railhome,.railsheet{padding:4px 6px}
  .hero,.modes{grid-template-columns:1fr} .qtext{font-size:18px} .opt{font-size:16px}
}
</style>

<body>
<div class="app">
  <aside class="rail">
    <div class="railhome"><a data-home class="compact"></a></div>
    <div class="brand">IB Chemistry<small>Nov 10 · Moles &amp; formulas</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="railsheet"><button class="btn small" id="sheetBtn" type="button">Formula sheet</button></div>
    <div class="rail-foot"><span>Progress is saved in this browser.</span><button class="themebtn" id="themeBtn" type="button">Change theme</button></div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<dialog id="sheet"><div class="row" style="justify-content:space-between"><h2>Formula sheet</h2><button class="btn small" id="sheetClose" type="button">Close</button></div><div id="sheetBody"></div></dialog>
<script src="../../ask-ai.js"></script>
<script src="../../home.js"></script>
<script src="data.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const SUBJECT="IB Chemistry (moles, percent composition, empirical and molecular formulas)";
const LET="ABCDEFGH", KEY="ibchem-nov10-v1";
let store={seen:{},test:null};
try{store=Object.assign(store,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function record(id,ok){const r=store.seen[id]||{r:0,w:0};ok?r.r++:r.w++;r.last=ok;store.seen[id]=r;save()}

const ROUTES=[["#/","Dashboard"],["#/guide","Study guide"],["#/practice","Practice questions"],["#/written","Written problems"],["#/cards","Flashcards"],["#/test","November 10th Test"],["#/key","Test answer key"]];
function nav(){const h=location.hash||"#/";$("#nav").innerHTML=ROUTES.map(([r,l])=>`<a href="${r}" class="${(h===r||(r==="#/practice"&&h.startsWith("#/practice")))?"on":""}">${l}</a>`).join("")}

/* ---------- formula sheet ---------- */
$("#sheetBody").innerHTML=SHEET.map(s=>`<h3>${s.h}</h3><table class="nt">${s.rows.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join("")}</table>`).join("");
$("#sheetBtn").onclick=()=>$("#sheet").showModal(); $("#sheetClose").onclick=()=>$("#sheet").close();
$("#themeBtn").onclick=()=>{const r=document.documentElement;const d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);r.setAttribute("data-theme",d?"light":"dark");try{localStorage.setItem("theme",d?"light":"dark")}catch(e){}};

/* ---------- views ---------- */
const view=$("#view");
function topicStats(t){const qs=QS.filter(q=>q.t===t);let right=0,seen=0;qs.forEach(q=>{const r=store.seen[q.id];if(r){seen++;if(r.last)right++}});return{n:qs.length,seen,right}}
function dashboard(){
  const tot=QS.length,seen=QS.filter(q=>store.seen[q.id]).length,right=QS.filter(q=>store.seen[q.id]&&store.seen[q.id].last).length;
  view.innerHTML=`<header><div class="eyebrow">IB Chemistry · Test Tuesday, Nov 10</div><h1>Moles, percent composition &amp; empirical formulas</h1><p class="lede" style="margin-top:8px">Covers worksheets 3.1 to 3.6. Work the written problems on paper, drill the multiple choice, then take the November 10th Test.</p></header>
  <div class="hero"><div class="test-card"><div class="eyebrow">Practice bank</div><div class="count">${tot}</div><div>multiple choice questions, ${TEACHER.length} teacher problems and ${NEWW.length} new written problems. ${seen?`You have answered ${seen} (${right} right last time).`:""}</div><a class="btn" href="#/test">Take the November 10th Test</a></div>
  <div class="card info"><h3 style="margin-bottom:10px">Know for test day</h3><dl><dt>Coverage</dt><dd>Worksheets 3.1 to 3.6</dd><dt>Allowed</dt><dd>Green data sheet + scientific calculator</dd><dt>Not given</dt><dd>Conversion factors. Memorize 1 mol = 6.02 × 10²³ particles</dd></dl></div></div>
  <div class="modes"><a class="mode" href="#/guide"><b>Study guide</b><span>Methods, tables and common mistakes</span></a><a class="mode" href="#/practice"><b>Practice questions</b><span>Multiple choice with explanations, by topic</span></a><a class="mode" href="#/written"><b>Written problems</b><span>Teacher's 12 plus 8 new, with full work</span></a><a class="mode" href="#/cards"><b>Flashcards</b><span>Arrow keys to flip and move</span></a></div>
  <section><h2 style="margin-bottom:12px">Topics</h2><div class="topics">${Object.keys(TOPICS).map(t=>{const s=topicStats(t);return`<button class="topic" data-t="${t}" type="button"><span class="n">${TOPICS[t]}</span><span class="bar"><i style="width:${s.n?100*s.right/s.n:0}%"></i></span><span class="s"><span>${s.right}/${s.n} right</span><span>Practice →</span></span></button>`}).join("")}</div></section>`;
  $$(".topic").forEach(b=>b.onclick=()=>{location.hash="#/practice/"+b.dataset.t});
}
function guide(){
  view.innerHTML=`<header><div class="eyebrow">Study guide</div><h1>Everything on the test, in order</h1></header>`+NOTES.map(n=>`<section class="card guide-sec" id="${n.id}"><h2>${n.title}</h2>${n.html}</section>`).join("")+`<div class="actions"><a class="btn primary" href="#/practice">Practice questions</a></div>`;
}

/* ---- multiple choice session ---- */
let S=null;
function practiceSetup(topic){
  const sel=new Set(topic&&TOPICS[topic]?[topic]:Object.keys(TOPICS));let count=10;
  const draw=()=>{view.innerHTML=`<header><div class="eyebrow">Practice questions</div><h1>Build a quiz</h1></header>
  <div class="card" style="display:flex;flex-direction:column;gap:18px"><div><div class="label">Topics</div><div class="chips">${Object.keys(TOPICS).map(t=>`<button class="chip" data-t="${t}" aria-pressed="${sel.has(t)}" type="button">${TOPICS[t]}</button>`).join("")}</div></div>
  <div><div class="label">Questions</div><div class="seg">${[5,10,20,"All"].map(c=>`<button data-c="${c}" aria-pressed="${count===c}" type="button">${c}</button>`).join("")}</div></div>
  <div class="actions"><button class="btn primary" id="go" type="button" ${sel.size?"":"disabled"}>Start</button><span class="muted small">${QS.filter(q=>sel.has(q.t)).length} questions match</span></div></div>`;
  $$(".chip").forEach(b=>b.onclick=()=>{sel.has(b.dataset.t)?sel.delete(b.dataset.t):sel.add(b.dataset.t);draw()});
  $$(".seg button").forEach(b=>b.onclick=()=>{count=b.dataset.c==="All"?"All":+b.dataset.c;draw()});
  $("#go").onclick=()=>{let pool=shuffle(QS.filter(q=>sel.has(q.t)));if(count!=="All")pool=pool.slice(0,count);startSession(pool)}};
  draw();
}
function mkItem(q){const order=shuffle(q.o.map((_,i)=>i));return{q,order,a:order.indexOf(0)}}
function startSession(pool){S={items:pool.map(mkItem),i:0,right:0,picked:null,log:[]};question()}
function aiBox(it,k){return AskAI.box({lang:"en",subject:SUBJECT,question:it.q.q,options:it.order.map(o=>it.q.o[o]),correct:it.a,picked:k==null?"(left blank)":k,explanation:it.q.e})}
function question(){
  const it=S.items[S.i],n=S.items.length;
  view.innerHTML=`<div class="qhead"><span class="qtag">${TOPICS[it.q.t]} · ${S.i+1} of ${n}</span><div class="progress"><i style="width:${100*S.i/n}%"></i></div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:18px"><div class="qtext">${it.q.q}</div><div class="opts">${it.order.map((o,k)=>`<button class="opt" data-k="${k}" type="button"><span class="l">${LET[k]}</span><span>${it.q.o[o]}</span></button>`).join("")}</div><div id="fb"></div></div>`;
  $$(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function answer(k){
  const it=S.items[S.i];if(S.picked!=null)return;S.picked=k;const ok=k===it.a;record(it.q.id,ok);if(ok)S.right++;S.log.push({it,k,ok});
  $$(".opt").forEach((b,j)=>{b.disabled=true;if(j===it.a)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
  const last=S.i===S.items.length-1;
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><div><b class="t">${ok?"Correct.":"Not quite."}</b> ${it.q.e}</div>${ok?"":aiBox(it,k)}<div class="actions"><button class="btn primary" id="next" type="button">${last?"See results":"Next"} <span class="kbd mouse-only">→</span></button></div></div>`;
  $("#next").onclick=next;
}
function next(){S.picked=null;if(S.i===S.items.length-1)return results();S.i++;question()}
function results(){
  const n=S.items.length,miss=S.log.filter(l=>!l.ok);
  view.innerHTML=`<header><div class="eyebrow">Results</div><div class="score">${S.right}/${n}</div><p class="lede" style="margin-top:8px">${Math.round(100*S.right/n)}%. ${miss.length?"Review what you missed below.":"Clean sweep."}</p></header>
  ${miss.map(l=>`<details class="wp" open><summary>${l.it.q.q}</summary><div class="in"><div><b>Answer:</b> ${l.it.q.o[0]}</div><div class="muted">${l.it.q.e}</div>${aiBox(l.it,l.k)}</div></details>`).join("")}
  <div class="actions"><a class="btn primary" href="#/practice">New quiz</a><a class="btn" href="#/">Dashboard</a></div>`;
  S=null;
}
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea"))return;
  const h=location.hash;
  if((h.startsWith("#/practice")||h==="#/test")&&S&&view.querySelector(".opt")){
    const k="1234".indexOf(e.key),l="abcd".indexOf(e.key.toLowerCase());
    if(S.picked==null&&(k>=0||l>=0)){const n=k>=0?k:l;const b=$$(".opt")[n];if(b)b.click()}
    else if(S.picked!=null&&(e.key==="ArrowRight"||e.key==="Enter")){e.preventDefault();$("#next")&&$("#next").click()}
  }
  if(h==="#/cards"){if(e.key==="ArrowRight")cardGo(1);else if(e.key==="ArrowLeft")cardGo(-1);else if(e.key===" "||e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();cardFlip()}}
});

/* ---- written problems ---- */
function wlist(arr){return arr.map(p=>`<details class="wp"><summary>${p.title}</summary><div class="in"><p>${p.text}</p><details><summary class="small muted" style="cursor:pointer">Show answers and work</summary><div class="sol" style="margin-top:8px">${p.parts.map(r=>`<div>${r[0]?`<b>${r[0]})</b> `:""}<span class="a">${r[1]}</span><div class="muted small">${r[2]}</div></div>`).join("")}</div></details></div></details>`).join("")}
function written(){
  view.innerHTML=`<header><div class="eyebrow">Written problems</div><h1>Work these on paper first</h1><p class="lede" style="margin-top:8px">Open a problem only after you have tried it. Your teacher's 12 problems come first, then 8 new ones in the same style.</p></header>
  <section><h2 style="margin-bottom:12px">Your teacher's 12</h2><div style="display:flex;flex-direction:column;gap:10px">${wlist(TEACHER)}</div></section>
  <section><h2 style="margin-bottom:12px">8 new problems</h2><div style="display:flex;flex-direction:column;gap:10px">${wlist(NEWW)}</div></section>`;
}

/* ---- flashcards ---- */
let deck=[],ci=0,flipped=false;
function cards(){deck=CARDS.slice();ci=0;flipped=false;drawCard()}
function drawCard(){
  const c=deck[ci];
  view.innerHTML=`<header><div class="eyebrow">Flashcards</div><h1>Memorize the essentials</h1><p class="lede" style="margin-top:8px"><span class="kbd">←</span> <span class="kbd">→</span> to move, <span class="kbd">space</span> to flip.</p></header>
  <div class="qhead"><span class="qtag">Card ${ci+1} of ${deck.length}</span><div class="progress"><i style="width:${100*(ci+1)/deck.length}%"></i></div></div>
  <div class="card flash" id="flash" tabindex="0" role="button" aria-label="Flip card">${flipped?`<div class="muted small">ANSWER</div><div class="ans">${c[1]}</div>`:`<div class="muted small">PROMPT</div><div class="p">${c[0]}</div>`}</div>
  <div class="actions"><button class="btn" id="prev" type="button">← Back</button><button class="btn primary" id="flip" type="button">Flip</button><button class="btn" id="nx" type="button">Next →</button><button class="btn small" id="shuf" type="button">Shuffle</button></div>`;
  $("#flash").onclick=cardFlip;$("#flip").onclick=cardFlip;$("#prev").onclick=()=>cardGo(-1);$("#nx").onclick=()=>cardGo(1);$("#shuf").onclick=()=>{deck=shuffle(CARDS);ci=0;flipped=false;drawCard()};
}
function cardFlip(){flipped=!flipped;drawCard()}
function cardGo(d){ci=(ci+d+deck.length)%deck.length;flipped=false;drawCard()}

/* ---- November 10th Test ---- */
let TS=null,timer=null;
function testIntro(){
  const prev=store.test;
  view.innerHTML=`<header><div class="eyebrow">Practice test</div><h1>November 10th Test</h1><p class="lede" style="margin-top:8px">${TEST_IDS.length} multiple choice questions (1 mark each) plus ${TEST_WRITTEN.length} written problems (${TEST_WRITTEN.length*5} marks to self-score). Use only the formula sheet and a calculator. 45 minutes suggested. Memorize 6.02 × 10²³.</p></header>
  <div class="card" style="display:flex;flex-direction:column;gap:14px"><div class="row"><b>Part A</b><span class="muted">${TEST_IDS.length} multiple choice, answers checked at the end</span></div><div class="row"><b>Part B</b><span class="muted">${TEST_WRITTEN.length} written problems, worked on paper, then compared with the key</span></div>
  ${prev?`<div class="tip">Last attempt: ${prev.score}/${TEST_IDS.length} on Part A.</div>`:""}
  <div class="actions"><button class="btn primary" id="begin" type="button">Begin Part A</button><a class="btn" href="#/key">Answer key</a></div></div>`;
  $("#begin").onclick=()=>{TS={items:TEST_IDS.map(id=>mkItem(QS[id])),i:0,ans:[],t0:Date.now()};testQ()};
}
function testQ(){
  const it=TS.items[TS.i],n=TS.items.length,sel=TS.ans[TS.i];
  view.innerHTML=`<div class="qhead"><span class="qtag">November 10th Test · Part A · ${TS.i+1} of ${n}</span><div class="progress"><i style="width:${100*TS.i/n}%"></i></div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:18px"><div class="qtext">${it.q.q}</div><div class="opts">${it.order.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="${sel===k}" type="button"><span class="l">${LET[k]}</span><span>${it.q.o[o]}</span></button>`).join("")}</div>
  <div class="actions"><button class="btn" id="tb" type="button" ${TS.i?"":"disabled"}>← Back</button><button class="btn primary" id="tn" type="button">${TS.i===n-1?"Finish Part A":"Next →"}</button></div></div>`;
  $$(".opt").forEach(b=>b.onclick=()=>{TS.ans[TS.i]=+b.dataset.k;testQ()});
  $("#tb").onclick=()=>{TS.i--;testQ()};$("#tn").onclick=()=>{if(TS.i===n-1)testDone();else{TS.i++;testQ()}};
}
function testDone(){
  const n=TS.items.length;let score=0;const rows=TS.items.map((it,j)=>{const ok=TS.ans[j]===it.a;if(ok)score++;return{it,ok,k:TS.ans[j]}});
  store.test={score,t:Date.now()};save();const mins=Math.round((Date.now()-TS.t0)/60000);
  view.innerHTML=`<header><div class="eyebrow">Part A results</div><div class="score">${score}/${n}</div><p class="lede" style="margin-top:8px">${Math.round(100*score/n)}% in about ${mins} min. Now do Part B on paper, then check it below.</p></header>
  <section><h2 style="margin-bottom:12px">Part B: written</h2><div style="display:flex;flex-direction:column;gap:10px">${wlist(TEST_WRITTEN.map(i=>NEWW[i]))}</div></section>
  <section><h2 style="margin:6px 0 12px">Part A review</h2><div style="display:flex;flex-direction:column;gap:10px">${rows.map((r,j)=>`<details class="wp" ${r.ok?"":"open"}><summary><b style="color:var(${r.ok?"--good":"--bad"})">${j+1}. ${r.ok?"✓":"✗"}</b> ${r.it.q.q}</summary><div class="in">${r.ok?"":`<div>Your answer: ${r.k==null?"(left blank)":r.it.q.o[r.it.order[r.k]]}</div>`}<div><b>Answer:</b> ${r.it.q.o[0]}</div><div class="muted">${r.it.q.e}</div>${r.ok?"":aiBox(r.it,r.k)}</div></details>`).join("")}</div></section>
  <div class="actions"><button class="btn primary" id="again" type="button">Retake</button><a class="btn" href="#/">Dashboard</a></div>`;
  $("#again").onclick=()=>testIntro();TS=null;
}
function key(){
  view.innerHTML=`<header><div class="eyebrow">Answer key</div><h1>November 10th Test</h1><p class="lede" style="margin-top:8px">Try the test first. Part A answers use the order shown below (the live test shuffles the choices).</p></header>
  <section><h2 style="margin-bottom:12px">Part A</h2><div style="display:flex;flex-direction:column;gap:10px">${TEST_IDS.map((id,j)=>{const q=QS[id];return`<details class="wp"><summary>${j+1}. ${q.q}</summary><div class="in"><div><b>Answer:</b> <span style="color:var(--accent);font-weight:700">${q.o[0]}</span></div><div class="muted">${q.e}</div></div></details>`}).join("")}</div></section>
  <section><h2 style="margin:6px 0 12px">Part B (5 marks each: 1 setup, 2 correct work, 1 answer, 1 units and sig figs)</h2><div style="display:flex;flex-direction:column;gap:10px">${wlist(TEST_WRITTEN.map(i=>NEWW[i]))}</div></section>`;
}

/* ---------- router ---------- */
function route(){
  const h=location.hash||"#/";nav();S=h.startsWith("#/practice")?S:null;
  if(h==="#/")dashboard();else if(h==="#/guide")guide();else if(h.startsWith("#/practice")){const t=h.split("/")[2];(S&&!t)?question():practiceSetup(t)}
  else if(h==="#/written")written();else if(h==="#/cards")cards();else if(h==="#/test")testIntro();else if(h==="#/key")key();else dashboard();
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
