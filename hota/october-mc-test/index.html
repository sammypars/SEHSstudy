<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HOTA Interro Unité 2</title>
<meta name="description" content="Révision pour l'interro à choix multiple d'histoire des Amériques : la Constitution, l'esclavage, l'abolitionnisme, les causes de la Guerre civile et la guerre.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: fixed left rail + one reading column, on faint ruled-notebook paper (the one flourish) */
:root{
  --bg:#F5F1E8; --surface:#FFFDF8; --sunk:#EEE7DA; --ink:#1F1A16; --muted:#6A6057; --line:#E0D6C6;
  --accent:#8E2C21; --accent-ink:#FFFFFF; --accent-soft:#F5E3DE;
  --blue:#24406B; --blue-soft:#E3E9F3;
  --rule:rgba(36,64,107,.07);
  --good:#1E7041; --good-soft:#E2F2E7; --bad:#B42318; --bad-soft:#FBE8E5;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14110E; --surface:#1D1915; --sunk:#26211C; --ink:#EEE7DB; --muted:#A99D8F; --line:#352E27;
  --accent:#E8826F; --accent-ink:#14110E; --accent-soft:#3A221D;
  --blue:#8FB0E3; --blue-soft:#1E2838; --rule:rgba(143,176,227,.06);
  --good:#5CCB8A; --good-soft:#15291D; --bad:#F2867A; --bad-soft:#331A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14110E; --surface:#1D1915; --sunk:#26211C; --ink:#EEE7DB; --muted:#A99D8F; --line:#352E27;
  --accent:#E8826F; --accent-ink:#14110E; --accent-soft:#3A221D;
  --blue:#8FB0E3; --blue-soft:#1E2838; --rule:rgba(143,176,227,.06);
  --good:#5CCB8A; --good-soft:#15291D; --bad:#F2867A; --bad-soft:#331A17; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 30px}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em;font-weight:650}
h1{font-size:clamp(28px,4.2vw,42px);font-weight:800}
h2{font-size:23px}
h3{font-size:18px}
p{margin:0}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;padding:0 10px 4px;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;font-weight:400;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.navgroup{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 10px 4px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.rail-foot{margin-top:auto;padding:10px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.rail-foot a{color:var(--muted)}
.main{padding-block:36px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.lede{color:var(--muted);max-width:64ch;font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.themebtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--muted)}

/* dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.test-card{background:var(--blue);color:#fff;border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px}
:root[data-theme="dark"] .test-card{color:#0f1622}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .test-card{color:#0f1622}}
.test-card .eyebrow{color:inherit;opacity:.75}
.test-card ul{margin:0;padding-left:18px;font-size:15px}
.test-card .count{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}
.test-card .btn{background:var(--surface);color:var(--ink);border-color:var(--surface);align-self:flex-start}
.topic{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.topic:hover{border-color:var(--accent)}
.topic .u{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.topic .n{font-weight:650;font-size:15.5px;line-height:1.3}
.bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.topic .s{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

/* setup */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:30px;padding:7px 14px;cursor:pointer;font-size:14.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:650}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer;font-family:var(--f-mono);font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.label{font-weight:650;font-size:14.5px;margin-bottom:8px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.progress{flex:1;min-width:140px;height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtag{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.qtext{font-size:20px;font-weight:600;line-height:1.45;max-width:68ch}
.qtext q,.qquote{font-family:var(--f-display);font-weight:500;font-style:italic}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:13px 15px;cursor:pointer;font-size:16px;line-height:1.45;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--bg)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt.dim{opacity:.55}
.feedback{border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);background:var(--surface)}
.feedback.ok{border-left:4px solid var(--good)}
.feedback.no{border-left:4px solid var(--bad)}
.verdict{font-family:var(--f-display);font-weight:700;font-size:20px}
.feedback.ok .verdict{color:var(--good)} .feedback.no .verdict{color:var(--bad)}
.why h4{margin:0 0 4px;font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.why p{max-width:70ch}
details.all summary{cursor:pointer;font-weight:600;font-size:14.5px;color:var(--accent)}
details.all ol{margin:10px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
details.all li{font-size:14.5px;display:flex;gap:10px}
details.all li b{font-family:var(--f-mono);flex:none}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.missed{display:flex;flex-direction:column;gap:8px}
.missed div{border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14.5px;background:var(--surface)}

/* notes */
.notes-nav{display:flex;flex-wrap:wrap;gap:8px}
.notes-nav a{border:1px solid var(--line);background:var(--surface);border-radius:30px;padding:6px 14px;font-size:14px;text-decoration:none;color:var(--ink);font-weight:500}
.notes-nav a:hover{border-color:var(--accent)}
.lesson{display:flex;flex-direction:column;gap:14px}
.lesson .qe{font-family:var(--f-display);font-style:italic;font-size:17px;color:var(--muted)}
.lesson h3{margin-top:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.lesson ul,.lesson ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:75ch}
.table{width:100%;border-collapse:collapse;font-size:14.5px}
.table th,.table td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
.table th{background:var(--sunk);font-weight:650;font-size:13.5px}
.lesson .table{display:block;overflow-x:auto}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 8px 8px 0;font-size:15px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:96px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:84px 24px minmax(0,1fr);align-items:baseline;gap:0;padding:7px 0}
.tl .d{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right;padding-right:6px}
.tl .dot{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);justify-self:center;position:relative;top:1px}
.tl li.war .dot{border-color:var(--blue);background:var(--blue)}
.tl .e{font-size:15.5px}
.tl .era{grid-column:1/-1;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:14px 0 2px 120px}

/* people / lexicon */
input[type=search]{font:inherit;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;width:100%;max-width:360px;color:var(--ink)}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.term{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.term b{font-weight:650}
.term p{font-size:14.5px;color:var(--muted)}
.term .u{font-family:var(--f-mono);font-size:10.5px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.term .en{font-style:italic;color:var(--blue);font-size:14px}
.quote{border-left:3px solid var(--blue);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:2px}
.quote q{font-family:var(--f-display);font-style:italic;font-size:16.5px;quotes:none}
.quote span{font-size:13.5px;color:var(--muted)}

/* index card */
.cardtools{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cardtools label{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
textarea{font-family:var(--f-mono);font-size:13px;line-height:1.5;width:100%;min-height:340px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:12px;resize:vertical}
.cardsides{display:flex;flex-wrap:wrap;gap:16px}
.icard{background:#fff;color:#111;border:1px solid #cfc6b8;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:.12in .14in;overflow:hidden;font-family:"Source Sans 3",Arial,sans-serif;line-height:1.2;white-space:pre-wrap;word-break:break-word;flex:none}
.icard-wrap{display:flex;flex-direction:column;gap:6px;max-width:100%;overflow-x:auto}
.icard-wrap span{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.overflow{color:var(--bad);font-weight:600}

@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px max(12px,env(safe-area-inset-left,0px));z-index:5;gap:2px;border-right:0;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand small,.navgroup,.rail-foot{display:none}
  .brand{padding:0 8px 0 2px;white-space:nowrap;font-size:16px}
  .nav{display:flex;gap:2px}
  .nav a{white-space:nowrap;padding:7px 10px;font-size:14px}
  .hero,.grid3{grid-template-columns:1fr}
  .main{padding-block:22px 60px}
}
@media (max-width:560px){
  .grid2,.terms{grid-template-columns:1fr}
  .qtext{font-size:18px}
  .tl::before{left:70px}
  .tl li{grid-template-columns:60px 22px minmax(0,1fr)}
  .tl .era{padding-left:92px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff}
  .app>*:not(.main),.main>.wrap>*:not(#printarea){display:none!important}
  .app{display:block}.main{padding:0}
  #printarea{display:block!important}
  #printarea .icard{box-shadow:none;border:none;page-break-after:always;break-after:page;margin:0}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand">HOTA · Unité 2<small>Interro à choix multiple</small></div>
    <div class="nav" id="nav">
      <div class="navgroup">Réviser</div>
      <a href="#home" data-v="home">Tableau de bord</a>
      <a href="#practice" data-v="practice">Entraînement</a>

      <a href="#card" data-v="card">Carte index</a>
      <div class="navgroup">Référence</div>
      <a href="#timeline" data-v="timeline">Chronologie</a>
      <a href="#people" data-v="people">Personnages</a>
      <a href="#lex" data-v="lex">Vocabulaire</a>
    </div>
    <div class="rail-foot">
      <a id="hubLink" href="../../" hidden>← SEHS Study</a>
      <span>Ta progression est gardée dans ce navigateur.</span>
      <button class="themebtn" id="themeBtn" type="button">Changer de thème</button>
    </div>
  </nav>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>

<script src="data.js"></script>
<script>
/* ---------- utilities ---------- */
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=Math.random;
function shuffle(arr,r=R){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickN(arr,n,r=R){return shuffle(arr,r).slice(0,n)}
const $=s=>document.querySelector(s);
const LET="ABCDEF";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

/* ---------- storage (per-browser convenience only) ---------- */
const KEY="hota.u2.v1";
let store={stats:{},missed:[],total:0,card:null,cardSize:"4x6",cardFont:9.5};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)store=Object.assign(store,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function record(q,ok){const s=store.stats[q.t]||(store.stats[q.t]={a:0,c:0});s.a++;if(ok)s.c++;store.total++;
  const i=store.missed.indexOf(q.id);if(!ok&&i<0)store.missed.push(q.id);if(ok&&i>=0)store.missed.splice(i,1);save()}

/* ---------- generated questions ---------- */
function genChrono(i,seed){
  const r=rng(seed),kind=["when","first","last","when"][seed%4];
  if(kind==="when"){
    const [ev,,lab]=CHRONO[i];
    const near=CHRONO.map((c,j)=>({j,d:Math.abs(c[1]-CHRONO[i][1])})).filter(x=>CHRONO[x.j][2]!==lab).sort((a,b)=>a.d-b.d);
    const pool=[...new Set(near.slice(0,8).map(x=>CHRONO[x.j][2]))];
    const opts=shuffle([lab,...pickN(pool,3,r)],r);
    return {id:`g:chrono:${i}:${seed}`,t:"chrono",q:`Quand : <b>${esc(ev)}</b> ?`,o:opts.map(esc),a:opts.indexOf(lab),
      e:`${esc(ev)} : <b>${esc(lab)}</b>.`,w:opts.map(x=>{if(x===lab)return null;const c=CHRONO.find(c=>c[2]===x);return c?`${esc(x)}, c'est : ${esc(c[0])}.`:""})};
  }
  // first / last among four events with distinct labels
  let picks=[i];const used=new Set([CHRONO[i][2]]);
  for(const j of shuffle(CHRONO.map((_,k)=>k),r)){if(picks.length>=4)break;if(!used.has(CHRONO[j][2])){used.add(CHRONO[j][2]);picks.push(j)}}
  picks=shuffle(picks,r);
  const sorted=picks.slice().sort((a,b)=>CHRONO[a][1]-CHRONO[b][1]);
  const ans=kind==="first"?sorted[0]:sorted[sorted.length-1];
  const order=sorted.map(j=>`${esc(CHRONO[j][0])} (${esc(CHRONO[j][2])})`).join(" → ");
  return {id:`g:chrono:${i}:${seed}`,t:"chrono",q:`Lequel de ces événements s'est produit <b>${kind==="first"?"en premier":"en dernier"}</b> ?`,
    o:picks.map(j=>esc(CHRONO[j][0])),a:picks.indexOf(ans),e:`Ordre : ${order}.`,w:picks.map(j=>j===ans?null:`${esc(CHRONO[j][0])} : ${esc(CHRONO[j][2])}.`)};
}
function genPers(i,seed){
  const r=rng(seed),[name,desc,grp]=PEOPLE[i],rev=seed%2===1;
  let pool=PEOPLE.map((_,j)=>j).filter(j=>j!==i&&PEOPLE[j][2]===grp);
  if(pool.length<3)pool=pool.concat(pickN(PEOPLE.map((_,j)=>j).filter(j=>j!==i&&!pool.includes(j)),3-pool.length,r));
  const ord=shuffle([i,...pickN(pool,3,r)],r);
  if(!rev)return {id:`g:pers:${i}:${seed}`,t:"pers",q:`Qui est-ce ?<br><span class="muted" style="font-weight:500">${esc(desc)}</span>`,o:ord.map(j=>esc(PEOPLE[j][0])),a:ord.indexOf(i),
    e:`<b>${esc(name)}</b> : ${esc(desc)}`,w:ord.map(j=>j===i?null:`${esc(PEOPLE[j][0])} : ${esc(PEOPLE[j][1])}`)};
  return {id:`g:pers:${i}:${seed}`,t:"pers",q:`Quelle description correspond à <b>${esc(name)}</b> ?`,o:ord.map(j=>esc(PEOPLE[j][1])),a:ord.indexOf(i),
    e:`<b>${esc(name)}</b> : ${esc(desc)}`,w:ord.map(j=>j===i?null:`Ça, c'est ${esc(PEOPLE[j][0])}.`)};
}
function genCit(i,seed){
  const r=rng(seed),[qt,au,ctx]=QUOTES[i];
  const others=[...new Set(QUOTES.map(x=>x[1]).filter(a=>a!==au))];
  const opts=shuffle([au,...pickN(others,3,r)],r);
  return {id:`g:cit:${i}:${seed}`,t:"cit",q:`Qui a dit ou écrit :<br><span class="qquote">${esc(qt)}</span>`,o:opts.map(esc),a:opts.indexOf(au),
    e:`<b>${esc(au)}</b> · ${esc(ctx)}.`,w:opts.map(a=>{if(a===au)return null;const x=QUOTES.find(q=>q[1]===a);return x?`${esc(a)} a dit : ${esc(x[0])}`:""})};
}
function genLex(i,seed){
  const r=rng(seed),[fr,en,d]=LEX[i],rev=seed%2===1;
  const ord=shuffle([i,...pickN(LEX.map((_,j)=>j).filter(j=>j!==i),3,r)],r);
  if(!rev)return {id:`g:lex:${i}:${seed}`,t:"lex",q:`Quel terme correspond à cette définition ?<br><span class="muted" style="font-weight:500">${esc(d)}</span>`,o:ord.map(j=>esc(LEX[j][0])),a:ord.indexOf(i),
    e:`<b>${esc(fr)}</b> (<i>${esc(en)}</i>) : ${esc(d)}`,w:ord.map(j=>j===i?null:`${esc(LEX[j][0])} : ${esc(LEX[j][2])}`)};
  return {id:`g:lex:${i}:${seed}`,t:"lex",q:`Quelle est la bonne définition de <b>${esc(fr)}</b> (<i>${esc(en)}</i>) ?`,o:ord.map(j=>esc(LEX[j][2])),a:ord.indexOf(i),
    e:`<b>${esc(fr)}</b> : ${esc(d)}`,w:ord.map(j=>j===i?null:`Ça, c'est la définition de « ${esc(LEX[j][0])} ».`)};
}
const GEN={chrono:[genChrono,()=>CHRONO.length],pers:[genPers,()=>PEOPLE.length],cit:[genCit,()=>QUOTES.length],lex:[genLex,()=>LEX.length]};

/* ---------- build from id (ids let missed questions be rebuilt exactly) ---------- */
function build(id){
  const p=id.split(":");
  if(p[0]==="h"){const b=BANK[+p[1]];if(!b)return null;return {id,t:b.t,q:esc(b.q),o:b.o.map(esc),a:0,e:esc(b.e),w:b.w.map(x=>x&&esc(x)),bank:1}}
  const g=GEN[p[1]];if(!g)return null;const n=g[1]();const i=+p[2];if(i>=n)return null;return g[0](i,+p[3]);
}
function newSeed(){return 1+Math.floor(R()*2e9)}
function genIds(t,n){const out=[],len=GEN[t][1]();for(let k=0;k<n;k++)out.push(`g:${t}:${Math.floor(R()*len)}:${newSeed()}`);return out}
function bankIds(t){return shuffle(BANK.map((b,i)=>b.t===t?"h:"+i:null).filter(Boolean))}
function buildPool(topics,n){
  const lists=topics.map(t=>TOPICS[t].gen?genIds(t,n):bankIds(t));
  const out=[];let k=0;
  while(out.length<n&&lists.some(l=>l.length)){const l=lists[k%lists.length];if(l.length)out.push(l.shift());k++}
  return shuffle(out);
}

/* ---------- session ---------- */
let S=null;
function startSession(ids,label){ids=ids.filter(id=>build(id));if(!ids.length)return;S={ids,i:0,label,res:[],cur:null,answered:false};
  if(location.hash!=="#practice")location.hash="#practice";else render()}
function prepare(){const q=build(S.ids[S.i]);
  if(q.bank){const ord=shuffle(q.o.map((_,j)=>j));q.o=ord.map(j=>q.o[j]);q.w=ord.map(j=>q.w[j]);q.a=ord.indexOf(0)}
  S.cur=q;S.answered=false}
function renderQuiz(){
  if(!S.cur)prepare();const q=S.cur,n=S.ids.length;
  const opts=q.o.map((o,j)=>`<button class="opt" type="button" data-j="${j}"><span class="k">${LET[j]}</span><span style="min-width:0;flex:1">${o}</span></button>`).join("");
  $("#view").innerHTML=`
  <div class="qhead"><span class="qtag">${esc(S.label)} · ${S.i+1} / ${n}</span><div class="progress"><i style="width:${(S.i/n)*100}%"></i></div><button class="btn ghost small" id="quit" type="button">Terminer</button></div>
  <div class="card" style="display:flex;flex-direction:column;gap:18px">
    <span class="qtag">${TOPICS[q.t].u} · ${TOPICS[q.t].n}</span>
    <div class="qtext">${q.q}</div>
    <div class="opts">${opts}</div>
  </div>
  <div id="fb"></div>
  <div class="qfoot"><span class="small muted">Clavier : <span class="kbd">A</span>–<span class="kbd">D</span> ou <span class="kbd">1</span>–<span class="kbd">4</span> pour répondre, <span class="kbd">Entrée</span> pour continuer</span><button class="btn primary" id="next" type="button" disabled>Question suivante</button></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.j));
  $("#next").onclick=nextQ;$("#quit").onclick=finish;
}
function answer(j){
  if(S.answered)return;S.answered=true;const q=S.cur,ok=j===q.a;
  S.res.push({id:q.id,ok,t:q.t,q:q.q});record(q,ok);
  document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("right");else if(k===j)b.classList.add("wrong");else b.classList.add("dim")});
  const all=q.o.map((o,k)=>`<li><b>${LET[k]}</b><span>${k===q.a?"Bonne réponse. "+q.e:(q.w[k]||"Ce n'est pas la meilleure réponse.")}</span></li>`).join("");
  $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">
    <div class="verdict">${ok?"Correct":"Pas tout à fait. La réponse est "+LET[q.a]}</div>
    ${!ok&&q.w[j]?`<div class="why"><h4>Pourquoi ${LET[j]} est faux</h4><p>${q.w[j]}</p></div>`:""}
    <div class="why"><h4>Pourquoi ${LET[q.a]} est correct</h4><p>${q.e}</p></div>
    <details class="all"><summary>Explication pour chaque option</summary><ol>${all}</ol></details>
  </div>`;
  const nb=$("#next");nb.disabled=false;nb.textContent=S.i+1>=S.ids.length?"Voir les résultats":"Question suivante";nb.focus();
}
function nextQ(){if(!S.answered)return;S.i++;if(S.i>=S.ids.length){finish();return}S.cur=null;renderQuiz();window.scrollTo({top:0})}
function finish(){
  const res=S.res,c=res.filter(x=>x.ok).length,n=res.length,label=S.label;S=null;
  const by={};res.forEach(x=>{(by[x.t]=by[x.t]||{a:0,c:0}).a++;if(x.ok)by[x.t].c++});
  const miss=res.filter(x=>!x.ok);
  $("#view").innerHTML=`<div class="eyebrow">Séance terminée</div><h1>${esc(label)}</h1>
  <div class="card row" style="justify-content:space-between;gap:24px">
    <div><div class="score">${n?Math.round(c/n*100):0}%</div><div class="muted">${c} sur ${n} correctes</div></div>
    <div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px">${Object.keys(by).map(t=>`<div><div class="row small" style="justify-content:space-between"><span>${TOPICS[t].n}</span><span class="mono">${by[t].c}/${by[t].a}</span></div><div class="bar"><i style="width:${by[t].c/by[t].a*100}%"></i></div></div>`).join("")}</div>
  </div>
  ${miss.length?`<div class="row" style="justify-content:space-between"><h2>Questions ratées</h2><button class="btn primary" id="retry" type="button">Refaire ces ${miss.length}</button></div><div class="missed">${miss.map(x=>`<div>${x.q}</div>`).join("")}</div>`:(n?`<div class="callout">Sans faute. Essaie un examen blanc ou un mélange plus long.</div>`:"")}
  <div class="row"><button class="btn" id="again" type="button">Nouvelle série</button><a class="btn ghost" href="#home">Tableau de bord</a></div>`;
  if(miss.length)$("#retry").onclick=()=>startSession(miss.map(x=>x.id),"Questions ratées");
  $("#again").onclick=()=>{location.hash="#practice";render()};
}

  $("#cfont").oninput=e=>{store.cardFont=+e.target.value;$("#cfontv").textContent=store.cardFont+" pt";save();draw()};
  $("#creset").onclick=()=>{store.card=null;save();$("#ctext").value=CARD_DEFAULT;draw()};
  $("#cprint").onclick=()=>{$("#printarea").hidden=false;window.print();setTimeout(()=>{$("#printarea").hidden=true},500)};
}

/* ---------- router ---------- */
const VIEWS={home:viewHome,practice:viewPractice,notes:viewNotes,timeline:viewTimeline,people:viewPeople,lex:viewLex,card:viewCard};
function updateNav(){const v=(location.hash||"#home").slice(1);document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v))}
function render(){const v=(location.hash||"#home").slice(1);(VIEWS[v]||viewHome)();updateNav()}
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(S&&v!=="practice")S=null;render();window.scrollTo({top:0})});
document.addEventListener("keydown",e=>{
  if(!S||!S.cur||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const k=e.key.toUpperCase();let j=LET.indexOf(k);if(j<0&&/^[1-6]$/.test(k))j=+k-1;
  if(j>=0&&j<S.cur.o.length&&!S.answered){answer(j);e.preventDefault()}
  else if(e.key==="Enter"&&S.answered){nextQ();e.preventDefault()}
});
$("#themeBtn").onclick=()=>{const r=document.documentElement,cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");r.setAttribute("data-theme",cur==="dark"?"light":"dark")};
if(/github\.io$|^localhost$|^127\.|^$/.test(location.hostname))$("#hubLink").hidden=false;
render();
</script>
