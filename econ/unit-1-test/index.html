<style>
/* Same design system as the SEHS Study hub and the other class sites: Fraunces / Source Sans 3 / IBM Plex Mono, warm neutral paper, econ blue accent */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --sunk:#ECEBE5; --ink:#1B1C1E; --muted:#62656B; --line:#E1E0DA;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#E8EDFB;
  --dem:#1F4FD1; --sup:#C2410C;
  --good:#1E7041; --good-soft:#E2F2E7; --bad:#B42318; --bad-soft:#FBE8E5; --warn:#9A6700;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121315; --surface:#1B1C1F; --sunk:#25262A; --ink:#ECEBE7; --muted:#A3A5AA; --line:#2E3034;
  --accent:#7C9BFF; --accent-ink:#121315; --accent-soft:#1D2540;
  --dem:#7C9BFF; --sup:#F08A4B;
  --good:#5CCB8A; --good-soft:#15291D; --bad:#F2867A; --bad-soft:#331A17; --warn:#E3B341; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1B1C1F; --sunk:#25262A; --ink:#ECEBE7; --muted:#A3A5AA; --line:#2E3034;
  --accent:#7C9BFF; --accent-ink:#121315; --accent-soft:#1D2540;
  --dem:#7C9BFF; --sup:#F08A4B;
  --good:#5CCB8A; --good-soft:#15291D; --bad:#F2867A; --bad-soft:#331A17; --warn:#E3B341; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em;font-weight:650}
h1{font-size:clamp(28px,4.2vw,42px);font-weight:800}
h2{font-size:23px}
h3{font-size:18px}
p{margin:0}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.railhome{padding:0 10px 14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;padding:0 10px 4px;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;font-weight:400;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.navgroup{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 10px 4px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav .count{font-family:var(--f-mono);font-size:11px;background:var(--bad-soft);color:var(--bad);border-radius:20px;padding:1px 7px}
.rail-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--muted)}
.main{padding-block:36px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.lede{color:var(--muted);max-width:64ch;font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.test-card{background:#17337F;color:#fff;border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px}
.test-card .eyebrow{color:inherit;opacity:.75}
:root[data-theme="dark"] .test-card{background:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .test-card{background:var(--accent);color:var(--accent-ink)}}
.test-card ul{margin:0;padding-left:18px;font-size:14px;opacity:.9}
.test-card .btn{background:var(--surface);color:var(--ink);border-color:var(--surface);align-self:flex-start}
.topic{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left}
.topic:hover{border-color:var(--accent)}
.topic .u{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.topic .n{font-weight:650;font-size:15px}
.bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.topic .s{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

/* setup */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:30px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:650}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer;font-family:var(--f-mono);font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.label{font-weight:650;font-size:14px;margin-bottom:8px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.progress{flex:1;min-width:140px;height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtag{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.qtext{font-size:20px;font-weight:600;line-height:1.45;max-width:68ch}
.qfig{display:flex;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}
.qfig.multi{gap:10px;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.diag{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:13px 15px;cursor:pointer;font-size:16px;line-height:1.45;width:100%}
.opts.diag .opt{flex-direction:column;align-items:stretch}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--bg)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt svg{width:100%;height:auto}
.feedback{border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);background:var(--surface)}
.feedback.ok{border-left:4px solid var(--good)}
.feedback.no{border-left:4px solid var(--bad)}
.verdict{font-family:var(--f-display);font-weight:700;font-size:20px}
.feedback.ok .verdict{color:var(--good)} .feedback.no .verdict{color:var(--bad)}
.why h4{margin:0 0 4px;font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.why p{max-width:70ch}
details.all summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
details.all ol{margin:10px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
details.all li{font-size:14px;display:flex;gap:10px}
details.all li b{font-family:var(--f-mono);flex:none}
.main,.wrap{min-width:0}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* svg diagrams */
svg.mkt,svg.ppc{max-width:100%;height:auto;display:block;font-family:var(--f-mono)}
.ax{stroke:var(--ink);stroke-width:1.6;fill:none}
.axl{fill:var(--ink);font-size:12px;font-weight:600}
.tick{fill:var(--muted);font-size:10.5px}
.cd{stroke:var(--dem);stroke-width:2.6;fill:none}
.cs{stroke:var(--sup);stroke-width:2.6;fill:none}
.base{opacity:.38}
.cl{font-size:11.5px;font-weight:600}
.cl.d{fill:var(--dem)} .cl.s{fill:var(--sup)}
.guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;fill:none}
.dot{fill:var(--ink)}
.ctl{stroke:var(--ink);stroke-width:1.6;fill:none}
.gap{stroke:var(--bad);stroke-width:2.2;fill:none}
.gapl{fill:var(--bad);font-size:11px;font-weight:600}
.pc{stroke:var(--accent);stroke-width:2.6;fill:none}
.pcb{stroke:var(--accent);stroke-width:2.6;fill:none;opacity:.4;stroke-dasharray:5 4}
.pl{fill:var(--ink);font-size:12px;font-weight:600}
.mtitle{fill:var(--muted);font-size:10.5px}
svg.mini .cl{font-size:10px}

/* content pages */
.prose{display:flex;flex-direction:column;gap:12px;max-width:70ch}
.prose ul,.prose ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.deede{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.deede div{border:1px solid var(--line);border-radius:9px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.deede b{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--accent);line-height:1}
.deede span{font-weight:650;font-size:14px}
.deede p{font-size:13px;color:var(--muted)}
.timeline{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--line);font-size:12.5px}
.timeline div{padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.timeline b{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.table th{background:var(--sunk);font-weight:650;font-size:13px}
.tablewrap{overflow-x:auto}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 8px 8px 0;font-size:14.5px}

/* worksheet */
.ws{display:flex;flex-direction:column;gap:14px}
.ws .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pick{display:flex;flex-direction:column;gap:6px;min-width:0}
.pick .pl2{font-family:var(--f-mono);font-size:12px;font-weight:600}
.pick .seg{flex-wrap:wrap}
.pick .seg button{font-family:var(--f-body);font-size:13px;padding:7px 10px;flex:1}
.pick .seg button.r{background:var(--good-soft);color:var(--good);font-weight:700}
.pick .seg button.x{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}

/* terms */
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.term{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.term b{font-weight:650}
.term p{font-size:14px;color:var(--muted)}
.term .u{font-family:var(--f-mono);font-size:10.5px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
input[type=search]{font:inherit;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;width:100%;max-width:360px;color:var(--ink)}
.score{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.missed{display:flex;flex-direction:column;gap:8px}
.missed div{border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px;background:var(--surface)}
.themebtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--muted)}

/* demand & supply notes */
.dets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.det{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:14px;cursor:pointer;min-width:0}
.det:hover{border-color:var(--accent)}
.det[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.det b{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1;color:var(--dem)}
.det.s b{color:var(--sup)}
.det span{font-weight:650;font-size:14px}
.det p{font-size:12.5px;color:var(--muted);margin:0}
.explore{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.rules{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.rules li{padding:8px 12px;border-radius:8px;background:var(--sunk)}
.arrowtag{font-family:var(--f-mono);font-weight:700}
.up{color:var(--good)} .dn{color:var(--bad)}
@media (max-width:860px){.explore{grid-template-columns:1fr}}
/* determinants of demand */
.tribe{display:flex;flex-direction:column;gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;min-width:0}
.tcard .tl{display:flex;flex-direction:column;gap:10px;min-width:0}
.tcard .letter{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1;color:var(--dem)}
.tcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.tcard .trap{font-size:14px;border-left:3px solid var(--bad);padding:6px 10px;background:var(--bad-soft);border-radius:0 6px 6px 0}
.tcard .figs{display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard .figs .qfig{padding:8px}
.sorter{display:flex;flex-direction:column;gap:14px}
.sorter .ev{font-size:18px;font-weight:600;line-height:1.45}
.sbtns{display:flex;flex-wrap:wrap;gap:8px}
.sbtns button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14.5px}
.sbtns button:hover:not(:disabled){border-color:var(--accent)}
.sbtns button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sbtns button.r{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.sbtns button.x{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
@media (max-width:860px){.tcard{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px max(12px,env(safe-area-inset-left,0px));z-index:5;gap:2px;border-right:0;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand small,.navgroup,.rail-foot{display:none}
  .railhome{padding:0 8px 0 0!important;flex:none}
  .brand{padding:0 8px 0 2px;white-space:nowrap;font-size:16px}
  .nav{display:flex;gap:2px}
  .nav a{white-space:nowrap;padding:7px 10px;font-size:13.5px}
  .hero,.grid3{grid-template-columns:1fr}
  .deede{grid-template-columns:repeat(2,minmax(0,1fr))}
  .main{padding-block:22px 60px}
}
@media (max-width:560px){
  .grid2,.terms,.opts.diag,.picks{grid-template-columns:1fr}
  .qtext{font-size:17px}
  .timeline{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ---------- utilities ---------- */
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=Math.random;
function shuffle(arr,r=R){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickN(arr,n,r=R){return shuffle(arr,r).slice(0,n)}

let SVGN=0;
const SH=2.2;
function mkt(o){
  o=o||{};const mini=!!o.mini;
  const W=mini?230:380,H=mini?175:290,L=mini?20:54,Rt=W-(mini?12:22),T=mini?12:18,B=H-(mini?20:42);
  const X=q=>L+(q/10)*(Rt-L),Y=p=>B-(p/10)*(B-T);
  const Ds=o.D||[0],Ss=o.S||[0];
  const dl=s=>({a:9+0.75*s,b:-0.75}),sl=s=>({a:1.5-0.75*s,b:0.75});
  const eq=(d,s)=>{const q=(d.a-s.a)/(s.b-d.b);return{q,p:d.a+d.b*q}};
  const id="clip"+(++SVGN);
  let g=`<svg viewBox="0 0 ${W} ${H}" class="mkt${mini?" mini":""}" role="img" aria-label="${o.aria||"Supply and demand diagram"}"><defs><clipPath id="${id}"><rect x="${L}" y="${T}" width="${Rt-L}" height="${B-T}"/></clipPath>
  <marker id="ad${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--dem)"/></marker>
  <marker id="as${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--sup)"/></marker></defs>`;
  g+=`<path class="ax" d="M${L} ${T-4}V${B}H${Rt+4}"/>`;
  g+=`<text class="axl" x="${L-(mini?12:20)}" y="${T+8}">P</text><text class="axl" x="${Rt-4}" y="${B+(mini?14:18)}">Q</text>`;
  if(o.title&&!mini)g+=`<text class="mtitle" x="${Rt}" y="${T+4}" text-anchor="end">${esc(o.title)}</text>`;
  const line=(ln,cls)=>`<line clip-path="url(#${id})" class="${cls}" x1="${X(0)}" y1="${Y(ln.a)}" x2="${X(10)}" y2="${Y(ln.a+10*ln.b)}"/>`;
  const endpt=ln=>{for(let q=9.6;q>0;q-=0.1){const p=ln.a+ln.b*q;if(p>0.5&&p<9.6)return{q,p}}return{q:5,p:5}};
  const lab=(ln,txt,c)=>{const e=endpt(ln);return`<text class="cl ${c}" x="${X(e.q)+4}" y="${Y(e.p)+(c==="d"?-4:12)}" text-anchor="end">${txt}</text>`};
  Ds.forEach((s,i)=>{const ln=dl(s);g+=line(ln,"cd"+(Ds.length>1&&i===0?" base":""));g+=lab(ln,Ds.length>1?"D"+(i+1):"D","d")});
  Ss.forEach((s,i)=>{const ln=sl(s);g+=line(ln,"cs"+(Ss.length>1&&i===0?" base":""));g+=lab(ln,Ss.length>1?"S"+(i+1):"S","s")});
  // arrows
  if(Ds.length>1){const s=Ds[Ds.length-1],p=7.3,q1=(p-dl(0).a)/-0.75,q2=(p-dl(s).a)/-0.75;g+=`<line x1="${X(q1)+(s>0?5:-5)}" y1="${Y(p)}" x2="${X(q2)+(s>0?-5:5)}" y2="${Y(p)}" stroke-width="1.6" style="stroke:var(--dem)" marker-end="url(#ad${id})"/>`}
  if(Ss.length>1){const s=Ss[Ss.length-1],p=2.9,q1=(p-sl(0).a)/0.75,q2=(p-sl(s).a)/0.75;g+=`<line x1="${X(q1)+(s>0?5:-5)}" y1="${Y(p)}" x2="${X(q2)+(s>0?-5:5)}" y2="${Y(p)}" stroke-width="1.6" style="stroke:var(--sup)" marker-end="url(#as${id})"/>`}
  const e1=eq(dl(Ds[0]),sl(Ss[0])),e2=eq(dl(Ds[Ds.length-1]),sl(Ss[Ss.length-1]));
  const changed=Ds.length>1||Ss.length>1;
  const pts=changed?[[e1,"1"],[e2,"2"]]:[[e1,"e"]];
  pts.forEach(([e,n])=>{
    if(!o.ceil&&!o.floor){g+=`<path class="guide" d="M${L} ${Y(e.p)}H${X(e.q)}V${B}"/>`;
      if(!mini){const sub=changed?n:"";g+=`<text class="tick" x="${L-6}" y="${Y(e.p)+4}" text-anchor="end">P${changed?sub:"e"}</text><text class="tick" x="${X(e.q)}" y="${B+15}" text-anchor="middle">Q${changed?sub:"e"}</text>`}}
    g+=`<circle class="dot" cx="${X(e.q)}" cy="${Y(e.p)}" r="${mini?3:3.6}"/>`;
  });
  const ctrl=(pc,kind)=>{const y=Y(pc),qd=(pc-dl(0).a)/-0.75,qs=(pc-sl(0).a)/0.75;
    let s=`<path class="ctl" d="M${L} ${y}H${Rt}"/><text class="tick" x="${L-6}" y="${y+4}" text-anchor="end">${kind==="c"?"Pmax":"Pmin"}</text>`;
    s+=`<path class="guide" d="M${L} ${Y(e1.p)}H${X(e1.q)}"/><text class="tick" x="${L-6}" y="${Y(e1.p)+4}" text-anchor="end">Pe</text>`;
    s+=`<path class="guide" d="M${X(qd)} ${y}V${B}M${X(qs)} ${y}V${B}"/>`;
    s+=`<text class="tick" x="${X(qd)}" y="${B+15}" text-anchor="middle">Qd</text><text class="tick" x="${X(qs)}" y="${B+15}" text-anchor="middle">Qs</text>`;
    const a=Math.min(qd,qs),b=Math.max(qd,qs),yy=kind==="c"?y+14:y-10;
    s+=`<path class="gap" d="M${X(a)} ${yy-4}V${yy+4}M${X(a)} ${yy}H${X(b)}M${X(b)} ${yy-4}V${yy+4}"/><text class="gapl" x="${(X(a)+X(b))/2}" y="${kind==="c"?yy+16:yy-8}" text-anchor="middle">${kind==="c"?"shortage":"surplus"}</text>`;
    return s};
  if(o.ceil)g+=ctrl(o.ceil,"c");
  if(o.floor)g+=ctrl(o.floor,"f");
  return g+"</svg>";
}
function ppc(o){
  const W=380,H=290,L=56,Rt=W-22,T=18,B=H-44;
  const X=x=>L+(x/10)*(Rt-L),Y=y=>B-(y/10)*(B-T);
  let g=`<svg viewBox="0 0 ${W} ${H}" class="ppc" role="img" aria-label="Production possibilities curve"><path class="ax" d="M${L} ${T-4}V${B}H${Rt+4}"/>`;
  g+=`<text class="axl" x="${(L+Rt)/2}" y="${B+30}" text-anchor="middle">${esc(o.xl||"Good X")}</text>`;
  g+=`<text class="axl" transform="translate(${L-30} ${(T+B)/2}) rotate(-90)" text-anchor="middle">${esc(o.yl||"Good Y")}</text>`;
  (o.curves||[{rx:8,ry:8}]).forEach((c,i)=>{
    if(c.line){g+=`<path class="${c.base?"pcb":"pc"}" d="M${X(0)} ${Y(c.ry)}L${X(c.rx)} ${Y(0)}"/>`}
    else{let d="";for(let k=0;k<=40;k++){const t=(k/40)*Math.PI/2,x=c.rx*Math.sin(t),y=c.ry*Math.cos(t);d+=(k?"L":"M")+X(x).toFixed(1)+" "+Y(y).toFixed(1)}g+=`<path class="${c.base?"pcb":"pc"}" d="${d}"/>`}
    if(c.lab){const lx=c.line?c.rx*0.62:c.rx*Math.sin(1.05),ly=c.line?c.ry*0.38:c.ry*Math.cos(1.05);g+=`<text class="pl" x="${X(lx)+8}" y="${Y(ly)-6}">${c.lab}</text>`}
  });
  (o.arrows||[]).forEach(a=>{g+=`<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(a[2])}" y2="${Y(a[3])}" stroke-width="1.6" style="stroke:var(--ink)"/><circle cx="${X(a[2])}" cy="${Y(a[3])}" r="2" class="dot"/>`});
  (o.pts||[]).forEach(p=>{g+=`<circle class="dot" cx="${X(p[0])}" cy="${Y(p[1])}" r="4"/><text class="pl" x="${X(p[0])+8}" y="${Y(p[1])-7}">${p[2]}</text>`});
  return g+"</svg>";
}
function fig(spec){if(!spec)return"";if(Array.isArray(spec))return spec.map(fig).join("");return spec.k==="ppc"?ppc(spec):mkt(spec)}

/* Unit 1: scarcity, choice, systems */
Q("u1b","Which definition of economics best matches the IB course?",["The study of how scarce resources are allocated to satisfy people's needs and wants","The study of money, banks and the stock market","The study of how businesses maximise profit","The study of how governments collect taxes"],0,
"Economics is a social science about choice under scarcity: limited resources, unlimited wants, and how societies decide what to produce, how, and for whom.",[null,"Money and finance are one part of economics, but the subject is much broader: it covers every decision about using scarce resources.","Profit is one motive economists study, but households, governments and whole economies are also studied.","Taxation is a policy tool inside economics, not the definition of the subject."]);
Q("u1b","Scarcity exists because...",["human needs and wants are unlimited, while the resources to satisfy them are limited","prices are too high for many people","governments restrict the production of goods","some countries are poorer than others"],0,
"Scarcity is the gap between unlimited wants and limited resources. It applies to every society, rich or poor, which is why choices must be made.",[null,"High prices are a result of scarcity (and of demand and supply), not its cause.","Even with no government restrictions at all, resources would still be limited relative to wants.","Rich countries also face scarcity. A billionaire still has only 24 hours in a day."]);
Q("u1b","Opportunity cost is best defined as...",["the value of the next best alternative given up when a choice is made","the money price paid for a good","the total value of all alternatives given up","the cost of producing one more unit of a good"],0,
"Opportunity cost is only the single next best alternative forgone, not every alternative and not necessarily money.",[null,"A price is a monetary cost. Opportunity cost can exist even when something is free in money terms, such as the time spent doing it.","Only the next best alternative counts, because you could only have done one of them instead.","That describes marginal cost, a production concept, not opportunity cost."]);
Q("u1b","Maya can spend Saturday working a shift that pays $80, studying for economics, or going to the coast. If she had not gone to the coast she would have worked. What is the opportunity cost of going to the coast?",["The $80 shift she gave up","Both the $80 shift and the study time","Nothing, because the coast trip is free","The cost of the gas to get there"],0,
"Opportunity cost is the next best alternative. She says she would have worked, so the shift (and its $80) is what she sacrificed.",[null,"She could only have done one alternative instead, so you count only the next best one, not both.","The trip uses her time, which has an alternative use. Something with a zero money price can still have an opportunity cost.","Gas is a money cost of the trip, but the question asks what she gave up by choosing the trip."]);
Q("u1b","Which of the following is the best example of a free good in economics?",["Air in the open atmosphere","A free sample handed out in a supermarket","A public library book","School lunch provided at no charge"],0,
"A free good has zero opportunity cost: using it does not take resources away from anything else. Air in the atmosphere fits; there is enough for everyone without using scarce resources.",[null,"The sample cost the firm resources to produce. It is free to you, but it is an economic good.","Books, buildings and librarians use scarce resources paid for by taxes.","Food, staff and kitchens all use scarce resources; the cost is paid by taxpayers rather than students."]);
Q("u1b","Which item is classified as the factor of production land?",["Crude oil reserves under the North Sea","A machine in a car factory","A software engineer","The founder of a start-up"],0,
"Land means all natural resources: soil, minerals, oil, fish, forests and water.",[null,"A machine is man-made and used to produce other goods, so it is capital.","A worker supplies human effort, which is labour.","The founder organises the other factors and takes risks, which is entrepreneurship."]);
Q("u1b","Which is an example of capital as a factor of production?",["A delivery van used by a bakery","Savings deposited in a bank account","A share of stock in a company","A family car used for weekend trips"],0,
"Capital is man-made goods used to produce other goods and services: tools, machines, buildings, vehicles used in business.",[null,"Money is financial capital. In IB economics the factor of production capital means physical, man-made inputs.","A share is a financial asset, not a physical input into production.","A car used for personal trips is a consumer good, because it is not used to produce anything."]);
Q("u1b","Which factor of production is responsible for organising land, labour and capital and taking the risk of a business venture?",["Entrepreneurship","Labour","Capital","Land"],0,
"Entrepreneurs combine the other factors and bear risk. Their reward is profit.",[null,"Labour is human physical and mental effort used in production, but it does not carry the business risk.","Capital is man-made inputs such as machinery.","Land is natural resources."]);
Q("u1b","The reward (factor income) earned by entrepreneurship is...",["profit","wages","rent","interest"],0,
"The standard pairing is: land earns rent, labour earns wages, capital earns interest, entrepreneurship earns profit.",[null,"Wages are the reward to labour.","Rent is the reward to land.","Interest is the reward to capital."]);
Q("u1b","Which of these questions would be studied in macroeconomics?",["Why did the national unemployment rate rise last year?","Why did the price of avocados rise last month?","How many workers should a local bakery hire?","How does a household decide between buying a bike or a scooter?"],0,
"Macroeconomics studies the economy as a whole: national output, unemployment, inflation and growth.",[null,"One product's price is a single market, which is microeconomics.","A single firm's decision is microeconomics.","A single household's choice is microeconomics."]);
Q("u1b","A country debates whether cars should be built mainly by robots or mainly by workers. Which basic economic question is this?",["How to produce","What to produce","For whom to produce","How much to save"],0,
"Choosing between production methods (capital-intensive robots or labour-intensive workers) is the 'how to produce' question.",[null,"'What to produce' asks which goods to make. The good (cars) is already decided here.","'For whom' asks who receives the output, which is about distribution.","Saving is not one of the three basic economic questions."]);
Q("u1b","Deciding whether healthcare should go to everyone equally or to those who can pay most answers which basic economic question?",["For whom to produce","What to produce","How to produce","When to produce"],0,
"Distribution of output among people is the 'for whom' question.",[null,"The good (healthcare) is already chosen, so this is not about what to produce.","Nothing here is about the method of production.","Timing is not one of the three basic questions."]);
Q("u1b","In a free market economy, decisions about production and consumption are made mainly by...",["households and firms, through the price mechanism","the central government","international organisations","labour unions"],0,
"In a free market, prices formed by demand and supply coordinate the decisions of private households and firms.",[null,"Government making the decisions describes a planned economy.","International organisations do not make everyday production decisions in any system.","Unions bargain over wages but do not decide production for the whole economy."]);
Q("u1b","Which country is most often used as an example of a (mostly) planned economy?",["North Korea","Canada","Germany","Japan"],0,
"North Korea (and historically the Soviet Union, and Cuba to a large degree) has the state deciding what, how and for whom to produce.",[null,"Canada is a mixed economy with a large private sector.","Germany is a mixed economy (often called a social market economy).","Japan is a mixed economy."]);
Q("u1b","A mixed economy is one in which...",["both a private sector and a public sector play significant roles","all firms are owned by the government","there is no government intervention","only a few goods are produced"],0,
"Nearly every country today is mixed: private firms produce most goods, while government provides some services and regulates markets.",[null,"Full state ownership is a planned economy.","No intervention at all is a pure free market, which no real country has.","The number of goods produced has nothing to do with the definition."]);
Q("u1b","The public sector refers to...",["the part of the economy owned or run by the government","businesses that sell shares to the public","all firms that serve the public","consumers in an economy"],0,
"Public sector means government ownership and provision, such as public schools or police.",[null,"A company with public shareholders is still in the private sector.","Private firms serve the public too; what matters is ownership.","Consumers are households, not a sector of ownership."]);
Q("u1b","Why is economics called a social science?",["It studies human behaviour and how people interact, which is harder to test in controlled experiments","It uses only mathematical formulas","It only studies societies with governments","Its findings never change"],0,
"Economics studies people and their choices. Because people's behaviour is complex and changes, economists use models and empirical data instead of laboratory experiments alone.",[null,"Economics uses maths, but it also uses data, history, psychology and judgement.","It studies all human economic interaction, not only societies with governments.","The study guide stresses the opposite: the economic world is dynamic and constantly changing."]);
Q("u1b","Sustainability in economics means...",["meeting the needs of the present without compromising the ability of future generations to meet their own needs","maximising economic growth every year","using resources as fast as possible before prices rise","keeping prices constant over time"],0,
"This is the standard definition used in IB. It links directly to scarcity: finite resources cannot support endless consumption-based growth.",[null,"Maximum growth can conflict with sustainability, which is one of the debates the course highlights.","Fast depletion is the opposite of sustainable use.","Stable prices relate to inflation, not sustainability."]);
Q("u1b","Which of the following is NOT one of the nine IB key concepts?",["Profit","Scarcity","Interdependence","Intervention"],0,
"The nine concepts are scarcity, choice, efficiency, equity, economic well-being, sustainability, change, interdependence and intervention. Profit is not on the list.",[null,"Scarcity is a key concept and the central problem of economics.","Interdependence is a key concept: decision-makers rely on each other.","Intervention is a key concept: government involvement in markets."]);
Q("u1b","In IB economics, equity refers to...",["fairness, which is a normative idea","everyone receiving exactly the same income","producing at the lowest cost","the value of a company's shares"],0,
"Equity means fairness. Equality means sameness. A fair outcome is not necessarily an equal one, and judging fairness involves value judgements.",[null,"That is equality, not equity. The course distinguishes the two.","Lowest-cost production is about efficiency.","That is a finance meaning of equity, not the economic concept."]);
Q("u1b","Efficiency, as a key concept, is mainly about...",["making the best use of scarce resources with no waste","dividing income fairly","government control of prices","increasing the number of consumers"],0,
"Efficiency means getting the most value out of limited resources. On a PPC, efficient production is any point on the curve.",[null,"Fair division is equity.","Price control is a form of intervention, not a definition of efficiency.","The number of consumers is a demand determinant."]);
Q("u1b","Economic well-being refers to...",["levels of prosperity, economic satisfaction and quality of life","the size of a country's government","how many firms exist in an economy","the profits earned by banks"],0,
"Well-being covers people's living standards and security, not only income. Economic decisions affect the well-being of individuals and societies.",[null,"Government size is not a measure of well-being.","The number of firms is a supply determinant.","Bank profits are a narrow financial figure."]);

/* Unit 1: PPC */
Q("ppc","A production possibilities curve (PPC) shows...",["the maximum combinations of two goods an economy can produce when all resources are fully and efficiently used, with given technology","the prices of two goods over time","how much consumers want of two goods","the combination of goods a country will choose"],0,
"The PPC is a model of maximum potential output. It shows scarcity (limits), choice (points on the curve) and opportunity cost (moving along it).",[null,"The PPC has quantities on both axes, not prices.","It is about production possibilities, not consumer demand.","It shows what is possible; which point is chosen is a separate decision."]);
Q("ppc","Which is an assumption of the PPC model?",["The quantity and quality of resources and technology are fixed","Resources can grow without limit","The economy produces many goods","Prices are set by the government"],0,
"The model holds resources and technology constant and considers only two goods. Changing those assumptions is what shifts the curve.",[null,"If resources grew, the curve would shift outward; within one curve they are fixed.","The model simplifies to two goods so it can be drawn.","The PPC says nothing about how prices are set."]);
Q("ppc","Look at the diagram. Which point represents unemployed or inefficiently used resources?",["Point A","Point B","Point C","None of them"],0,
"A point inside the curve means the economy could produce more of both goods. Some resources are idle or used inefficiently.",[null,"B is on the curve, which means full and efficient use of resources.","C is outside the curve, which is currently unattainable.","A is inside the curve, so it does show unemployment."],{k:"ppc",xl:"Capital goods",yl:"Consumer goods",curves:[{rx:8,ry:8,lab:"PPC"}],pts:[[3,3,"A"],[5.66,5.66,"B"],[8,7.6,"C"]]});
Q("ppc","Using the same diagram, which point is currently unattainable?",["Point C","Point A","Point B","Points A and C"],0,
"Points outside the PPC cannot be produced with current resources and technology. That is what scarcity means on the diagram.",[null,"A is inside the curve, which is attainable but inefficient.","B is on the curve, which is attainable and efficient.","A is attainable; only C lies outside the curve."],{k:"ppc",xl:"Capital goods",yl:"Consumer goods",curves:[{rx:8,ry:8,lab:"PPC"}],pts:[[3,3,"A"],[5.66,5.66,"B"],[8,7.6,"C"]]});
Q("ppc","The economy moves from point A to point B on the diagram. This is best described as...",["actual growth, from using previously unemployed resources","growth in production possibilities","an increase in opportunity cost","a fall in efficiency"],0,
"Moving from inside the curve toward it means more output from existing resources. That is actual growth. The curve itself has not moved.",[null,"Growth in production possibilities requires the curve itself to shift outward.","No good is given up here: output of both rises, so there is no opportunity cost to the move.","Efficiency rises, because B is on the curve."],{k:"ppc",xl:"Necessity goods",yl:"Luxury goods",curves:[{rx:8,ry:8,lab:"PPC"}],pts:[[2.8,3,"A"],[5.66,5.66,"B"]],arrows:[[3.1,3.3,5.4,5.4]]});
Q("ppc","The diagram shows PPC1 shifting outward to PPC2. Which could cause this?",["An improvement in technology that affects both goods","A rise in unemployment","A choice to produce more guns and less butter","A fall in the price of butter"],0,
"An outward shift is growth in production possibilities. It comes from more or better resources (labour force growth, education, new capital) or better technology.",[null,"Rising unemployment moves the economy to a point inside the curve; the curve does not move.","Choosing a different mix is a movement along the existing curve.","Prices are not on a PPC and do not change production capacity."],{k:"ppc",xl:"Butter (consumer goods)",yl:"Guns (capital goods)",curves:[{rx:6.6,ry:6.6,lab:"PPC1",base:1},{rx:8.6,ry:8.6,lab:"PPC2"}]});
Q("ppc","Why is a typical PPC concave (bowed outward)?",["Resources are not equally suited to producing both goods, so opportunity cost increases","Resources are equally suited to both goods","Technology improves as you move along the curve","Consumers prefer one good"],0,
"As you specialise more in one good, you have to use resources that are worse at producing it, so each extra unit costs more of the other good. That is increasing opportunity cost.",[null,"Equally suited resources give constant opportunity cost and a straight-line PPC.","Technology is held constant along a single PPC.","Consumer preferences do not determine the shape of a production curve."]);
Q("ppc","The diagram shows a straight-line PPC for red cars and blue cars. What does the straight line show?",["Constant opportunity cost, because resources are equally good at producing both goods","Increasing opportunity cost","Unemployment of resources","Economic growth"],0,
"A factory can switch from red to blue paint with no loss of efficiency, so each extra blue car always costs one red car. Constant opportunity cost means a straight-line PPC.",[null,"Increasing opportunity cost gives a concave (bowed-out) curve.","Unemployment is a point inside the curve, not the curve's shape.","Growth is a shift of the curve, not its shape."],{k:"ppc",xl:"Blue cars",yl:"Red cars",curves:[{rx:8,ry:8,line:1,lab:"PPC"}]});
Q("ppc","A new technology improves only software production. What happens to the PPC (murals on the y-axis, software on the x-axis)?",["It pivots outward along the software axis; the murals intercept stays the same","It shifts outward on both axes equally","It shifts inward","Nothing; technology is not part of the PPC"],0,
"If the improvement affects only one good, the maximum of the other good is unchanged, so the curve pivots out along the improved good's axis.",[null,"An equal shift on both axes needs a change that helps both goods.","Better technology increases capacity; it never shrinks it.","Technology is one of the PPC's fixed assumptions; changing it moves the curve."],{k:"ppc",xl:"Software",yl:"Murals",curves:[{rx:6.5,ry:7,lab:"PPC1",base:1},{rx:9,ry:7,lab:"PPC2"}]});
Q("ppc","An economy moves from producing 50 food and 20 cars to 40 food and 30 cars, on its PPC. What is the opportunity cost of each extra car?",["1 unit of food","10 units of food","40 units of food","0, because the economy is efficient"],0,
"10 more cars cost 10 food, so each car costs 10/10 = 1 unit of food.",[null,"10 food is the cost of all 10 extra cars together, not of each car.","40 is the remaining food output, not what was given up.","Moving along the curve always has an opportunity cost: you must give up one good to get more of the other."]);
Q("ppc","Which event would shift a country's PPC inward?",["A war that destroys a large amount of factories and infrastructure","A rise in unemployment during a recession","An increase in immigration of skilled workers","More investment in education"],0,
"Destroying capital reduces the quantity of resources, which reduces maximum potential output.",[null,"A recession moves the economy inside the curve. The resources still exist; they are just idle.","More skilled workers is more labour, which shifts the curve outward.","Education improves labour quality, shifting the curve outward over time."]);
Q("ppc","An economy chooses to produce more capital goods and fewer consumer goods today. What is the likely long-run effect?",["Its PPC will shift outward further in the future","Its PPC will shift inward","It will move inside its PPC","Nothing will change in the future"],0,
"Capital goods (machinery, factories) increase future productive capacity. The trade-off is fewer consumer goods now in exchange for more growth later.",[null,"More capital increases capacity rather than reducing it.","Choosing a different point on the curve is still efficient; it does not create unemployment.","Investment today affects future output, which is the whole point of the choice."]);
Q("ppc","Which PPC feature illustrates choice?",["Selecting one point on the curve among many possible combinations","The curve shifting outward","The area outside the curve","The axes labels"],0,
"Because any point on the curve is possible, society must choose one combination. Choosing one means giving up others.",[null,"An outward shift illustrates growth.","Outside the curve illustrates scarcity (unattainable).","Axis labels are not a feature of the model."]);

/* Unit 1: methods and thought */
Q("meth","Which statement is a positive economic statement?",["Raising the minimum wage to $17 will reduce teen employment by 3%","The minimum wage should be raised to help families","It is unfair that some workers earn less than $15 an hour","The government ought to lower taxes on the rich"],0,
"Positive statements describe what is, was or will be. They can be tested with evidence, even if they turn out to be wrong.",[null,"'Should' signals a value judgement, which makes it normative.","'Unfair' is a value judgement about fairness (equity).","'Ought to' signals a normative statement."]);
Q("meth","A normative statement...",["includes a value judgement about what ought to be","can always be proven true with data","describes cause and effect only","is never used in policy debate"],0,
"Normative economics is about opinions on what should happen. Policy makers combine positive analysis with normative judgements.",[null,"Normative statements cannot be proven true or false with data; they depend on values.","Cause and effect claims are positive.","Policy debate is full of normative statements, for example about fairness."]);
Q("meth","'Ceteris paribus' means...",["all other things being equal (held constant)","the market is in equilibrium","prices are fixed by law","everyone has equal income"],0,
"Economists change one variable at a time while holding everything else constant, so they can isolate its effect. Your worksheet tells you to assume this.",[null,"Equilibrium is a separate concept.","It has nothing to do with legal price controls.","It is not about income distribution."]);
Q("meth","Why do economists use models?",["To simplify a complex reality so cause and effect can be analysed","Because models always predict perfectly","To avoid using real-world data","Because the economy never changes"],0,
"Models simplify by making assumptions. Their value is clarity, not perfect accuracy. Later they are tested against empirical evidence.",[null,"No model predicts perfectly; the TOK questions in your guide ask how realistic they are.","Models are tested with real data.","The economy is dynamic, which is why models need updating."]);
Q("meth","In positive economics, refutation means...",["a hypothesis can be tested and shown false by evidence","an economist disagrees with a value judgement","a model has been proven true forever","a government rejects an economic policy"],0,
"A scientific hypothesis must be testable. If evidence contradicts it, it is refuted and must be revised.",[null,"Disagreeing about values is normative debate.","Theories are never proven true forever; they survive tests until evidence refutes them.","Policy rejection is a political decision, not refutation."]);
Q("meth","Adam Smith (18th century) is most associated with...",["laissez-faire and the 'invisible hand' of the market","government management of aggregate demand","the critique that capitalism exploits workers","behavioural economics"],0,
"Smith's Wealth of Nations (1776) argued that self-interested individuals in free markets are guided, as if by an invisible hand, to benefit society. Laissez-faire means minimal government interference.",[null,"Managing aggregate demand is Keynes (20th century).","The exploitation critique is Marx (19th century).","Behavioural economics grew in the late 20th and 21st centuries."]);
Q("meth","Say's law, from classical macroeconomics, states that...",["supply creates its own demand","demand creates its own supply","governments should spend during recessions","money supply determines inflation"],0,
"Classical economists believed production generates the income needed to buy that production, so long-run unemployment would not persist.",[null,"That reverses Say's law.","Government spending in recessions is the Keynesian view.","That is the monetarist emphasis."]);
Q("meth","The Keynesian revolution of the 1930s argued that...",["governments should intervene to manage demand, especially during recessions","markets always return quickly to full employment","the money supply is the only cause of inflation","firms should be owned by the state"],0,
"During the Great Depression, Keynes argued that economies can stay stuck with high unemployment, so government spending and policy can be used to boost demand. This led to the rise of macroeconomic policy.",[null,"Quick self-correction was the classical belief Keynes challenged.","That is the monetarist position.","State ownership is closer to central planning, not Keynes."]);
Q("meth","The monetarist / new classical counter-revolution (from the 1970s) emphasised...",["limited government intervention and control of the money supply","higher government spending to cut unemployment","abolishing private property","the role of psychology in decisions"],0,
"Economists such as Milton Friedman argued that Keynesian policies caused inflation, and that markets work well with limited intervention and stable money growth.",[null,"That is the Keynesian approach they reacted against.","That is associated with Marxist thought.","That describes behavioural economics."]);
Q("meth","Karl Marx's critique of classical economics argued that...",["capitalism exploits workers and leads to inequality and instability","free markets always produce fair outcomes","supply creates its own demand","people are not always rational"],0,
"Marx argued that owners of capital profit from workers' labour, and predicted conflict between classes.",[null,"That is close to the classical view Marx criticised.","That is Say's law, a classical idea.","That is a behavioural economics insight."]);
Q("meth","Behavioural economics combines economics with...",["psychology, showing people do not always make rational choices","physics, to model markets as particles","only accounting data","political party platforms"],0,
"Behavioural economics studies biases and habits that lead to choices different from those predicted by rational models.",[null,"Physics is not the discipline it draws on.","It relies on experiments and observation of behaviour, not accounting.","It is not about party politics."]);
Q("meth","A circular economy aims to...",["keep resources in use through reuse, repair and recycling, reducing waste","maximise production of new goods","close the economy to international trade","circulate money faster through banks"],0,
"A circular economy contrasts with the linear take-make-dispose model. The 21st-century reasons for it link to sustainability and the limits of finite resources.",[null,"Maximising new production is closer to the linear model.","It has nothing to do with closing borders.","It is about materials and resources, not the speed of money."]);
Q("meth","Thinking 'at the margin' means considering...",["the effect of one additional unit","the average of all units","only the first unit","the total of all units"],0,
"The concept of the margin (19th-century classical micro) says decisions are made by comparing the extra benefit and extra cost of one more unit.",[null,"Averages are not the same as marginal values.","The margin is about the next unit, wherever that is.","Totals can hide what the next unit adds."]);
Q("meth","In the circular flow of income, households...",["supply factors of production to firms and receive factor incomes","produce goods and sell them to firms","set the prices of all goods","only interact with the government"],0,
"Households own the factors of production. They sell them to firms for wages, rent, interest and profit, then spend that income on firms' goods and services.",[null,"Firms produce goods; households buy them.","Prices are set by the interaction of demand and supply.","Households interact with firms, banks, government and the foreign sector."]);
Q("meth","Which of the following is an injection into the circular flow?",["Exports","Savings","Taxes","Imports"],0,
"Injections are investment, government spending and exports. Leakages (withdrawals) are savings, taxes and imports.",[null,"Savings is a leakage: income not spent.","Taxes are a leakage: income taken out of the flow.","Imports are a leakage: spending that goes to foreign firms."]);
Q("meth","Which set lists all three leakages from the circular flow?",["Savings, taxes, imports","Investment, government spending, exports","Wages, rent, interest","Savings, investment, exports"],0,
"Savings, taxes and imports take money out of the domestic flow of spending.",[null,"Those are the injections.","Those are factor incomes.","This mixes one leakage with two injections."]);
Q("meth","Classical microeconomics in the 19th century introduced the idea of utility, which means...",["the satisfaction a consumer gets from consuming a good","the usefulness of a good to a firm","the price of a good","the electricity used in production"],0,
"Utility is satisfaction. Diminishing marginal utility helps explain why demand curves slope downward.",[null,"It is about consumers, not firms.","Price and utility are different things.","That is an everyday meaning, not the economic one."]);

/* Unit 2: demand */
Q("dem","The law of demand states that, ceteris paribus...",["as the price of a good rises, the quantity demanded falls","as income rises, demand rises","as price rises, quantity supplied rises","demand always equals supply"],0,
"Price and quantity demanded are inversely related, which is why the demand curve slopes downward.",[null,"That describes a normal good's income effect, a non-price determinant.","That is the law of supply.","Demand equals supply only at equilibrium."]);
Q("dem","In economics, demand means...",["the quantity consumers are willing and able to buy at each possible price, over a period of time","how much consumers want a good","the amount bought last year","the amount firms produce"],0,
"Both 'willing' and 'able' matter: wanting a sports car without the money to buy it is not effective demand.",[null,"Wanting is not enough; consumers must also be able to pay.","Demand is the whole relationship at every price, not one historical figure.","That relates to supply."]);
Q("dem","Which is a reason the demand curve slopes downward?",["Diminishing marginal utility: each extra unit gives less satisfaction, so consumers pay less for it","Firms raise prices when costs rise","Governments tax goods","Consumers always buy the same quantity"],0,
"Other reasons are the income effect (a lower price raises real income) and the substitution effect (the good becomes cheaper relative to substitutes).",[null,"That is about supply and costs.","Taxes shift supply; they do not explain the slope of demand.","If quantity never changed, demand would be vertical."]);
Q("dem","A change in the price of the good itself causes...",["a movement along the demand curve (a change in quantity demanded)","a shift of the demand curve to the right","a shift of the demand curve to the left","a shift of the supply curve"],0,
"Price is on the axis, so changing it moves you along the existing curve. Only non-price determinants shift the curve.",[null,"Shifts are caused by non-price determinants such as income.","Shifts are caused by non-price determinants.","A price change on its own does not move the supply curve either; it is a movement along supply."]);
Q("dem","Market demand is found by...",["adding the quantities demanded by all individual consumers at each price","averaging individual prices","multiplying price by quantity","subtracting supply from demand"],0,
"Market demand is the horizontal sum of all individual demand curves.",[null,"Averaging prices does not produce a demand curve.","Price times quantity gives total spending (revenue).","That would give excess demand at a price, not market demand."]);
Q("dem","Incomes rise. What happens to the demand for a normal good?",["The demand curve shifts right","The demand curve shifts left","Quantity demanded rises along the curve","Nothing"],0,
"A normal good is one consumers buy more of as income rises, at every price.",[null,"A leftward shift with rising income describes an inferior good.","Income is a non-price determinant, so it shifts the curve rather than moving along it.","Income is a determinant of demand, so something does change."]);
Q("dem","Incomes rise. What happens to the demand for an inferior good?",["The demand curve shifts left","The demand curve shifts right","There is a movement along the curve","The supply curve shifts left"],0,
"Inferior goods are bought less as incomes rise, because people switch to preferred alternatives (for example, from instant noodles to restaurant meals).",[null,"Rightward is the normal good case.","Income shifts the curve; it does not move you along it.","Consumer income is a demand determinant, not supply."]);
Q("dem","Which good is most likely to be an inferior good?",["Long-distance bus tickets","Restaurant meals","New cars","International holidays"],0,
"As incomes rise, many people switch from buses to driving or flying, so bus demand falls. That is the definition of an inferior good.",[null,"Restaurant meals are a normal good; people eat out more as income rises.","New cars are a normal good.","Holidays abroad are a normal good, often called a luxury."]);
Q("dem","Tea and coffee are substitutes. The price of tea rises. What happens in the coffee market?",["Demand for coffee shifts right","Demand for coffee shifts left","Supply of coffee shifts right","Quantity demanded of coffee falls along the curve"],0,
"When a substitute becomes more expensive, consumers switch to the alternative, increasing its demand at every price.",[null,"A leftward shift would come from a cheaper substitute.","The tea price affects coffee buyers, not coffee producers.","Coffee's own price has not changed, so this is a shift, not a movement."]);
Q("dem","Hot dogs and hot dog buns are complements. The price of hot dogs rises. What happens to demand for buns?",["It shifts left","It shifts right","It does not change","Buns' supply shifts right"],0,
"Complements are used together. If hot dogs cost more, people buy fewer hot dogs and therefore need fewer buns.",[null,"A rightward shift would come from cheaper hot dogs.","Complement prices are a demand determinant, so it changes.","The change happens on the buyer side, not the producer side."]);
Q("dem","Consumers expect the price of gaming consoles to rise sharply next month. What happens to demand today?",["It shifts right, as people buy now before the rise","It shifts left","Quantity demanded falls","Supply shifts right"],0,
"Expected future price increases bring purchases forward, raising current demand.",[null,"Leftward would follow expected future price falls (people wait).","Nothing about the current price has changed; this is a shift.","The expectation here is held by consumers, so demand shifts."]);
Q("dem","Which would NOT shift the demand curve for pizza?",["A fall in the price of pizza","A rise in consumers' incomes","A fall in the price of burgers","A rise in the local population"],0,
"A change in pizza's own price causes a movement along the curve, not a shift.",[null,"Income is a non-price determinant, so it shifts demand (right for a normal good).","Burgers are a substitute; cheaper burgers shift pizza demand left.","More consumers shift demand right."]);
Q("dem","A news report shows that blueberries improve memory, and many people start buying them. This is a change in...",["tastes and preferences, shifting demand right","income, shifting demand right","costs of production, shifting supply right","price, causing a movement along demand"],0,
"Information and trends change what people want to buy at each price.",[null,"Nothing about income has changed.","The news affects buyers, not producers' costs.","The price of blueberries has not changed."]);
Q("dem","What is the difference between an 'increase in demand' and an 'increase in quantity demanded'?",["An increase in demand is a rightward shift of the curve; an increase in quantity demanded is a movement down along the curve due to a lower price","They mean the same thing","An increase in demand is caused by a lower price","An increase in quantity demanded is caused by higher income"],0,
"This distinction is tested often. Shifts come from non-price determinants; movements come from the good's own price.",[null,"Examiners treat them as different. Using the wrong phrase costs marks.","A lower price causes a movement, not a shift.","Higher income shifts the whole curve."]);
Q("dem","The number of people living in a city increases. What happens to demand for rental housing there?",["It shifts right","It shifts left","Quantity demanded falls","Supply shifts left"],0,
"More consumers means more is demanded at every price.",[null,"A smaller population would shift demand left.","Rent has not changed, so this is a shift.","Population growth is a demand determinant."]);

/* Unit 2: supply */
Q("sup","The law of supply states that, ceteris paribus...",["as price rises, the quantity supplied rises","as price rises, the quantity demanded falls","supply always increases over time","as costs rise, supply rises"],0,
"Higher prices raise potential profits and help cover higher marginal costs, so firms offer more. The supply curve slopes upward.",[null,"That is the law of demand.","Supply can increase or decrease depending on determinants.","Higher costs reduce supply."]);
Q("sup","Why does a higher price lead firms to supply more?",["It increases profitability and covers the rising cost of producing extra units","Consumers ask for more","Governments require it","Costs always fall as output rises"],0,
"Producing more usually means rising marginal costs. A higher price makes those extra units worth producing.",[null,"Consumer wishes are demand, not the reason supply slopes up.","Supply decisions are made by firms, not ordered by government.","Marginal costs usually rise as output increases in the short run."]);
Q("sup","The cost of wheat rises sharply. What happens to the supply of bread?",["It shifts left","It shifts right","Quantity supplied rises along the curve","Demand for bread shifts right"],0,
"Wheat is a factor input. Higher input costs mean bakers supply less at every price.",[null,"Lower input costs would shift supply right.","Bread's own price has not changed, so this is a shift.","The cost affects producers, not consumers' demand."]);
Q("sup","Beef and leather are in joint supply (produced together from cattle). The price of beef rises. What happens to the supply of leather?",["It shifts right","It shifts left","It does not change","Demand for leather shifts right"],0,
"A higher beef price leads farmers to slaughter more cattle, which produces more hides as a by-product. More leather is supplied at every price.",[null,"Leftward would follow a fall in the beef price.","Joint supply means the two outputs are linked, so leather supply changes.","The effect works through production, not consumer demand."]);
Q("sup","A farmer can grow either wheat or corn on the same land (competitive supply). The price of corn rises. What happens to the supply of wheat?",["It shifts left","It shifts right","It does not change","Demand for wheat shifts left"],0,
"Corn has become more profitable, so farmers switch land to corn, producing less wheat at every price.",[null,"Rightward would follow a fall in the corn price.","The goods compete for the same resources, so wheat supply is affected.","This is a supply-side decision by farmers."]);
Q("sup","The government places an indirect tax of $2 per unit on cigarettes. How does the supply curve change?",["It shifts upward (left) by $2 at every quantity","It shifts downward (right) by $2","It becomes vertical","It does not shift; demand shifts instead"],0,
"An indirect tax is like an extra cost of production for each unit, so firms need $2 more per unit to supply each quantity.",[null,"Downward shifts come from subsidies.","A tax does not make supply vertical.","The tax is paid by producers to the government, so it shifts supply."]);
Q("sup","A government subsidy to solar panel producers will...",["shift the supply of solar panels right","shift the supply of solar panels left","shift the demand for solar panels left","have no effect on the market"],0,
"A subsidy is a payment that lowers firms' effective costs, so they supply more at every price.",[null,"Leftward would follow a tax or a cost increase.","A subsidy to producers affects supply, not demand.","Subsidies change production incentives."]);
Q("sup","Automated assembly lines are introduced across the car industry. What happens to the supply of cars?",["It shifts right","It shifts left","Demand for cars shifts right","Quantity supplied falls"],0,
"Better technology lowers costs and increases productivity, so more cars are supplied at every price.",[null,"Better technology does not reduce supply.","Technology affects producers, not demand.","There is no change in the car price itself, so this is a shift, not a movement."]);
Q("sup","Oil producers expect the price of oil to rise sharply next year. What is the likely effect on supply today?",["Supply shifts left, as producers hold back output to sell later","Supply shifts right","Demand shifts right","No effect"],0,
"For storable goods, producers can withhold supply now and sell later at the higher expected price.",[null,"Rightward would follow expected future price falls (sell now before prices drop).","The expectation is held by producers, so supply shifts.","Expectations are a determinant of supply."]);
Q("sup","Several new firms enter the ride-share market. What happens?",["Market supply shifts right","Market supply shifts left","Demand shifts left","Quantity supplied rises along the curve"],0,
"Market supply is the sum of all firms' supply. More firms means more supplied at every price.",[null,"Firms leaving would shift supply left.","Entry of firms is a supply determinant.","This is a shift caused by a non-price factor."]);
Q("sup","A rise in the price of a good itself leads to...",["an extension of supply (movement up along the curve)","a rightward shift of supply","a leftward shift of supply","a fall in quantity supplied"],0,
"Higher price means firms move up along the same supply curve to a larger quantity supplied.",[null,"Shifts come from non-price determinants.","Shifts come from non-price determinants.","A higher price raises quantity supplied."]);
Q("sup","A severe drought hits avocado farms in Mexico. What happens to the avocado market?",["Supply shifts left, price rises, quantity falls","Supply shifts right, price falls, quantity rises","Demand shifts left, price falls","Demand shifts right, price rises"],0,
"Weather shocks reduce what farmers can produce at every price. A leftward supply shift raises the equilibrium price and lowers quantity.",[null,"A drought reduces output, so supply cannot increase.","The drought affects growers, not buyers.","The drought does not make people want more avocados."]);
Q("sup","Market supply is found by...",["adding the quantities supplied by all firms at each price","averaging the prices of all firms","taking the supply of the largest firm","subtracting demand from supply"],0,
"Like market demand, market supply is the horizontal sum of the individual supply curves.",[null,"Averaging prices does not create a supply curve.","Market supply includes every firm.","That gives excess supply at a price, not market supply."]);
Q("sup","The minimum wage rises, raising labour costs for restaurants. What happens in the market for restaurant meals?",["Supply shifts left","Supply shifts right","Demand shifts right","Quantity supplied rises"],0,
"Labour is a factor of production. Higher factor costs reduce supply at every price.",[null,"Higher costs do not increase supply.","Focus on what directly changes: restaurant costs, which is supply.","Meal prices have not changed yet, so this is a shift."]);

/* Unit 2: equilibrium */
Q("eq","Market equilibrium occurs where...",["quantity demanded equals quantity supplied, so there is no tendency for price to change","demand is greater than supply","the government sets the price","firms earn the highest possible profit"],0,
"At equilibrium the market clears: everything offered for sale is bought.",[null,"That is excess demand, a disequilibrium.","Equilibrium is reached by market forces, not law.","Equilibrium is about clearing the market, not maximising one group's profit."]);
Q("eq","If the market price is below equilibrium, there will be...",["excess demand (a shortage), which pushes the price up","excess supply (a surplus), which pushes the price down","equilibrium","no change in the market"],0,
"At a low price, quantity demanded is greater than quantity supplied. Buyers compete for the limited goods and the price rises until the market clears.",[null,"Surpluses happen above equilibrium.","Below equilibrium, Qd and Qs are not equal.","The shortage creates pressure for the price to rise."]);
Q("eq","If the market price is above equilibrium, what happens?",["There is a surplus; sellers cut prices until the market clears","There is a shortage; prices rise further","Demand shifts right","Supply shifts left"],0,
"Above equilibrium, Qs is greater than Qd. Unsold stock builds up, so firms reduce prices, quantity demanded extends and quantity supplied contracts.",[null,"Shortages happen below equilibrium.","The curves do not shift; movements along them restore equilibrium.","Supply does not shift; there is a contraction of quantity supplied."]);
Q("eq","The diagram shows a maximum price (Pmax) set below equilibrium. What does the distance between Qs and Qd represent?",["A shortage (excess demand)","A surplus (excess supply)","The tax revenue collected","The new equilibrium quantity"],0,
"At Pmax, consumers want Qd but firms only supply Qs. The gap is a shortage. Only Qs is actually sold.",[null,"A surplus happens when price is above equilibrium.","No tax is shown in the diagram.","There is no market-clearing equilibrium at Pmax; the market is in disequilibrium."],{D:[0],S:[0],ceil:3.9});
Q("eq","The diagram shows a minimum price (Pmin) set above equilibrium. What results?",["A surplus: quantity supplied is greater than quantity demanded","A shortage","A black market for the good","The equilibrium quantity is sold"],0,
"At Pmin, firms want to sell Qs but consumers only buy Qd, creating excess supply. Examples are agricultural price floors and the minimum wage (a surplus of labour, i.e. unemployment).",[null,"Shortages come from price ceilings below equilibrium.","Black markets are usually associated with price ceilings and shortages.","Only Qd is sold, which is less than the equilibrium quantity."],{D:[0],S:[0],floor:6.7});
Q("eq","A government sets a maximum price for rent above the current equilibrium rent. What happens?",["Nothing; the ceiling is not binding","A shortage of rental housing","A surplus of rental housing","Rents fall to the ceiling"],0,
"A ceiling only matters if it is below equilibrium. Above it, the market price is already lower, so the market stays at equilibrium.",[null,"A shortage requires the ceiling to be below equilibrium.","A maximum price cannot cause a surplus.","The market rent is already below the ceiling."]);
Q("eq","Which is a common consequence of a binding price ceiling?",["Shortages and the growth of black markets","Surpluses that the government must buy","Higher prices for consumers in the legal market","An increase in quantity supplied"],0,
"With Qd greater than Qs, some buyers cannot get the good legally and may pay higher prices illegally. Queues and waiting lists are also common.",[null,"Government purchases of surpluses go with price floors.","The legal price is held below equilibrium.","At a lower price, quantity supplied contracts."]);
Q("eq","Demand for a good increases (shifts right). What happens to equilibrium price and quantity?",["Price rises and quantity rises","Price falls and quantity rises","Price rises and quantity falls","Price falls and quantity falls"],0,
"At the old price there is now a shortage, which pushes price up. Supply extends along the curve to a higher quantity.",[null,"Price falls with higher quantity when supply increases.","That combination comes from a decrease in supply.","That combination comes from a decrease in demand."]);
Q("eq","Supply increases (shifts right). What happens to equilibrium price and quantity?",["Price falls and quantity rises","Price rises and quantity rises","Price rises and quantity falls","Price falls and quantity falls"],0,
"At the old price there is now a surplus, which pushes price down. Demand extends to a higher quantity.",[null,"That combination comes from an increase in demand.","That combination comes from a decrease in supply.","That combination comes from a decrease in demand."]);
Q("eq","Demand and supply both increase. What can you say for certain?",["Quantity rises; the change in price is indeterminate","Price rises; quantity is indeterminate","Price and quantity both rise","Price falls and quantity rises"],0,
"Both shifts push quantity up. But demand pushes price up while supply pushes it down, so the net effect on price depends on which shift is larger.",[null,"It is quantity that is certain here, not price.","Price only rises if demand shifts more than supply. That is not certain.","Price only falls if supply shifts more than demand. That is not certain."]);
Q("eq","Demand increases while supply decreases. What can you say for certain?",["Price rises; the change in quantity is indeterminate","Quantity rises; price is indeterminate","Price and quantity both fall","Price falls; quantity rises"],0,
"Both shifts push price up. Demand pushes quantity up and supply pushes it down, so quantity depends on the relative size of the shifts.",[null,"Quantity is the uncertain variable here.","Both shifts push price up, so it cannot fall.","Both shifts push price up."]);
Q("eq","The signalling function of the price mechanism means that...",["price changes communicate information to buyers and sellers about where resources are wanted","prices give firms a reason to break the law","governments signal their policies through prices","prices never change"],0,
"A rising price signals that a good is in high demand or short supply; a falling price signals the opposite. Producers and consumers respond to this information.",[null,"That has nothing to do with signalling.","Signals come from market forces, not government announcements.","Prices change constantly; that is how they signal."]);
Q("eq","The incentive function of price means that...",["a higher price motivates producers to supply more because it may be more profitable","a lower price motivates producers to supply more","prices are set to encourage saving","firms receive subsidies"],0,
"Incentives work through self-interest: a higher price encourages firms to increase output and consumers to buy less.",[null,"A lower price discourages production.","This is about price in a market, not savings.","Subsidies are government payments, not the price mechanism."]);
Q("eq","The rationing function of price means that...",["when goods are scarce, a higher price limits purchases to those willing and able to pay","the government distributes goods with coupons","firms limit how much each customer can buy","prices are always fair"],0,
"Price allocates scarce goods. As price rises, quantity demanded contracts until it matches what is available.",[null,"Coupon rationing is government intervention, not the price mechanism.","Purchase limits are non-price rationing.","Rationing by price is efficient but may not be equitable, which is a normative debate."]);
Q("eq","Demand for electric vehicles rises sharply. Which statement best describes resource reallocation?",["The higher price signals and incentivises firms to move labour and capital into EV production","Resources move away from EV production","Nothing changes because prices adjust","The government must assign workers to EV factories"],0,
"Rising demand raises the price and potential profits, so factors of production move toward EVs and away from goods in lower demand.",[null,"Resources move toward goods whose demand and price rise.","The price adjustment is what causes the reallocation.","In a market, the price mechanism does this without government direction."]);
Q("eq","When a shortage exists, how does the market return to equilibrium?",["Price rises, quantity demanded contracts and quantity supplied extends","Price falls, demand shifts right","Supply shifts left until the shortage ends","Demand shifts left until the shortage ends"],0,
"No curves shift. The price rises and both quantities move along their curves until they are equal.",[null,"In a shortage, price rises rather than falls.","The adjustment happens through movements along curves, not shifts.","The adjustment happens through movements along curves, not shifts."]);
Q("eq","The diagram shows a shift from e1 to e2. Which description uses the correct terms?",["An increase in demand causes an extension of supply (a movement along the supply curve)","An increase in supply causes an extension of demand","An increase in demand causes an increase in supply","A decrease in supply causes a contraction of demand"],0,
"The demand curve shifted right. The supply curve did not shift; firms moved up along it to a higher quantity supplied. Precise language like this earns marks.",[null,"The supply curve has not moved in this diagram.","Supply did not shift; quantity supplied changed along the curve.","Supply did not shift."],{D:[0,SH],S:[0]});
Q("eq","At the competitive market equilibrium, allocative efficiency is achieved, which means...",["social (community) surplus is maximised, so welfare is maximised","producers earn the highest possible price","consumers pay the lowest possible price","the government collects the most tax"],0,
