Q("dem","Which of these is a non-price determinant of demand?",["The price of a related good","The price of the good itself","The cost of raw materials","The number of firms in the market"],0,
"Non-price determinants of demand are buyer-side factors other than the good's own price: tastes, related goods, income, number of buyers and expectations (TRIBE). A change in the price of a substitute or complement shifts demand.",[null,"The good's own price causes a movement along the demand curve, not a shift. That is why it is not a non-price determinant.","Raw material costs affect producers, so they are a determinant of supply.","The number of firms affects how much is offered for sale, which is supply."]);
Q("dem","Which list contains only non-price determinants of demand?",["Tastes, prices of related goods, income, number of buyers, expectations","Income, technology, tastes, indirect taxes","The good's price, income, tastes, number of buyers","Costs of production, technology, number of firms"],0,
"TRIBE: Tastes and preferences, Related goods (substitutes and complements), Income (normal and inferior goods), number of Buyers, and Expectations.",[null,"Technology and indirect taxes act on producers, so they shift supply.","The good's own price is the price determinant. It moves you along the curve.","All three are supply-side determinants."]);
Q("dem","Concert tickets fall in price and fans buy more tickets. On a diagram this is...",["an extension of demand: a movement down along the demand curve","a rightward shift of the demand curve","a rightward shift of the supply curve","a contraction of demand"],0,
"Only the good's own price changed, so you move along the existing demand curve to a larger quantity. That is an increase in quantity demanded, also called an extension.",[null,"A shift needs a non-price determinant. Here the only change is the ticket price itself.","Nothing about the sellers' costs or numbers changed.","A contraction is a movement to a smaller quantity, which happens when price rises."]);
Q("dem","Ride-share apps become much cheaper. Ride-shares are a substitute for taxis. What happens to the demand for taxi rides?",["It shifts left","It shifts right","Quantity demanded of taxis rises along the curve","Supply of taxis shifts right"],0,
"When a substitute gets cheaper, buyers switch to it, so less of the original good is demanded at every price. Taxi demand shifts left.",[null,"Demand for a good rises when a substitute becomes more expensive, not cheaper.","The price of taxi rides did not change, so there is no movement along the taxi demand curve.","The change is in what riders want, not in how many taxis can be offered."]);
Q("dem","Workers learn they will get large pay rises next year and start spending more now. What happens to demand for normal goods today?",["It shifts right","It shifts left","It does not change until the pay rise arrives","Only supply changes"],0,
"Expectations include expected future income, not just expected future prices. Expecting to be richer makes people willing and able to buy more now, so demand shifts right.",[null,"A leftward shift would come from expecting lower income or worse times ahead.","Expectations act on behaviour today; that is why they are a determinant.","Expected income is a buyer-side factor, so demand is what changes."]);
Q("dem","A town's population ages and there are many more retirees. What happens to demand for retirement homes there?",["It shifts right","It shifts left","Quantity demanded rises along the curve","Nothing, because retirees have lower incomes"],0,
"The number and make-up of buyers (demographics) is a determinant of demand. More people in the buyer group means more demanded at every price.",[null,"There are more buyers of this good, not fewer.","No change in the price of retirement homes is given, so this is a shift, not a movement.","Even on a fixed income, more retirees means more buyers of this particular good."]);
Q("dem","Why does a change in consumers' income shift the demand curve rather than cause a movement along it?",["Income is not on either axis, so a change in it changes the quantity demanded at every price","Income directly changes the price of the good","Income affects supply, not demand","A change in income always causes a movement along the curve"],0,
"A demand diagram plots price against quantity. Any other variable, such as income, is held constant (ceteris paribus) along a curve. When it changes, the whole curve moves.",[null,"Income changes what buyers want to purchase; any price change comes later as the market adjusts.","Income belongs to buyers, so it is a demand determinant.","Movements along the curve only come from the good's own price."]);
Q("dem","Peanut butter and jelly are complements. A poor grape harvest makes jelly much more expensive. What happens to demand for peanut butter?",["It shifts left","It shifts right","It is unaffected","Supply of peanut butter shifts left"],0,
"Complements are used together. Pricier jelly means fewer sandwiches, so less peanut butter is demanded at every price.",[null,"Demand rises when a complement gets cheaper, not more expensive.","Related goods are a determinant of demand, so it is affected.","The grape harvest affects jelly producers, not peanut butter producers."]);
Q("sup","Which of these is a non-price determinant of supply?",["A change in the cost of raw materials","A change in consumers' incomes","A change in the price of a substitute in consumption","A change in the good's own price"],0,
"Non-price determinants of supply are producer-side factors other than the good's own price. Input costs are the most common one.",[null,"Income affects buyers, so it shifts demand.","Substitutes in consumption affect what buyers choose, so they shift demand.","The good's own price causes a movement along the supply curve."]);
Q("sup","Which list contains only non-price determinants of supply?",["Input costs, prices of related goods in production, taxes and subsidies, technology, expectations, number of firms","Input costs, income, tastes, technology","The good's price, technology, number of firms","Tastes, expectations, number of buyers"],0,
"A common memory aid is ROTTEN: Resource (input) costs, Other goods' prices (joint and competitive supply), Taxes and subsidies, Technology, Expectations, Number of sellers. Weather and natural shocks are often added.",[null,"Income and tastes are demand determinants.","The good's own price moves you along the curve.","These are demand determinants."]);
Q("sup","Why does an indirect tax shift the supply curve instead of causing a movement along it?",["It raises producers' cost per unit, so less is supplied at every price","It changes how much consumers are willing to pay","It reduces consumers' incomes","It is paid only by consumers"],0,

Q("sup","The price of laptops rises and manufacturers produce more laptops. This is...",["an extension of supply: a movement up along the supply curve","a rightward shift of the supply curve","an increase in demand","a contraction of supply"],0,

Q("sup","A new seed variety lets farmers grow 30% more corn per acre at the same cost. What happens to the supply of corn?",["It shifts right","It shifts left","Quantity supplied rises along the curve","Demand for corn shifts right"],0,

const DIRW={D:{1:"Demand shifts right (increases)","-1":"Demand shifts left (decreases)"},S:{1:"Supply shifts right (increases)","-1":"Supply shifts left (decreases)"}};
const PQ={"D1":[1,1],"D-1":[-1,-1],"S1":[-1,1],"S-1":[1,-1]};
const PQW={"1,1":"Price rises and quantity rises","-1,-1":"Price falls and quantity falls","-1,1":"Price falls and quantity rises","1,-1":"Price rises and quantity falls"};
const PQFROM={"1,1":"an increase in demand","-1,-1":"a decrease in demand","-1,1":"an increase in supply","1,-1":"a decrease in supply"};
function evDiag(c,d,mini,title){return mkt(c==="D"?{D:[0,SH*d],S:[0],mini,title}:{D:[0],S:[0,SH*d],mini,title})}
function outcomeText(c,d){const r=PQ[c+d];return PQW[r.join(",")]}

function genShift(kind,i,seed){
  const r=rng(seed),[m,e,c,d,k,why]=EV[i];
  const id=`g:${kind}:${i}:${seed}`,base={id,t:"shift"};
  const stem=`In the market for <b>${esc(m)}</b>, ${esc(e)}.`;
  const ge=evDiag(c,d,false,"Market for "+m);
  const combos=[["D",1],["D",-1],["S",1],["S",-1]];
  const correctIdx=combos.findIndex(x=>x[0]===c&&x[1]===d);
  const order=shuffle([0,1,2,3],r);
  const wFor=([cc,dd])=>{
    if(cc!==c)return `${cc==="D"?"Demand":"Supply"} is not what changes here. This is a ${c==="D"?"demand":"supply"} factor (${k.toLowerCase()}). ${why}`;
    return `Right curve, wrong direction. ${why}`};
  if(kind==="curve"){
    const o=order.map(j=>DIRW[combos[j][0]][combos[j][1]]);
    return Object.assign(base,{q:stem+" Which curve shifts, and in which direction?",o,a:order.indexOf(correctIdx),
      e:`${why} So ${DIRW[c][d].toLowerCase()}. The new equilibrium: ${outcomeText(c,d).toLowerCase()}.`,
      w:order.map(j=>j===correctIdx?null:wFor(combos[j])),ge});
  }
  if(kind==="diag"){
    const o=order.map(j=>evDiag(combos[j][0],combos[j][1],true));
    return Object.assign(base,{q:stem+" Which diagram shows the effect on this market?",o,a:order.indexOf(correctIdx),diag:1,
      e:`${why} The correct diagram shows ${DIRW[c][d].toLowerCase()}, so ${outcomeText(c,d).toLowerCase()}.`,
      w:order.map(j=>j===correctIdx?null:"That diagram shows "+DIRW[combos[j][0]][combos[j][1]].toLowerCase()+". "+wFor(combos[j])),ge});
  }
  if(kind==="pq"){
    const keys=["1,1","-1,-1","-1,1","1,-1"],corr=PQ[c+d].join(","),ord=shuffle(keys,r);
    return Object.assign(base,{q:stem+" What happens to the equilibrium price (P*) and quantity (Q*)?",o:ord.map(x=>PQW[x]),a:ord.indexOf(corr),
      e:`${why} That means ${DIRW[c][d].toLowerCase()}. ${c==="D"?(d>0?"At the old price there is now a shortage, so price rises and supply extends.":"At the old price there is now a surplus, so price falls and supply contracts."):(d>0?"At the old price there is now a surplus, so price falls and demand extends.":"At the old price there is now a shortage, so price rises and demand contracts.")} Result: ${outcomeText(c,d).toLowerCase()}.`,
      w:ord.map(x=>x===corr?null:`That outcome comes from ${PQFROM[x]}. Here the event causes ${DIRW[c][d].toLowerCase()}.`),ge});
  }
  // det: which determinant
  const pool=Object.keys(CAT).filter(x=>x!==k);
  const ds=pickN(pool,3,r),opts=shuffle([k,...ds],r);
  return Object.assign(base,{q:stem+" Which non-price determinant is responsible for the shift?",o:opts,a:opts.indexOf(k),
    e:`This is <b>${k.toLowerCase()}</b>: ${CAT[k]}. ${why}`,w:opts.map(x=>x===k?null:`${x} means ${CAT[x]}. That is not what changes in this scenario.`),ge});
}

 ["chocolate","cocoa bean prices rise and, at the same time, it is the week before Valentine's Day",1,-1,"Tastes and preferences","Cost of factors of production"],
 ["cigarettes","the indirect tax on cigarettes rises and, at the same time, an anti-smoking campaign succeeds",-1,-1,"Tastes and preferences","Indirect tax"],
 ["books","the price of magazines (a substitute) increases and, at the same time, the price of paper falls",1,1,"Price of a substitute","Cost of factors of production"],
 ["lemonade","new production technology is introduced and, at the same time, the price of fruit punch (a substitute) falls",-1,1,"Price of a substitute","Technology"],
 ["golf clubs","the price of golf balls (a complement) increases and, at the same time, the price of steel falls",-1,1,"Price of a complement","Cost of factors of production"],
 ["beef","the price of chicken (a substitute) increases and, at the same time, the price of cow hides (jointly supplied with beef) falls",1,-1,"Price of a substitute","Joint supply"]
];
const DOUT={"P+Q+":"Price rises and quantity rises","P-Q-":"Price falls and quantity falls","P+Q-":"Price rises and quantity falls","P-Q+":"Price falls and quantity rises",
 "P+Q?":"Price rises; the change in quantity is indeterminate","P-Q?":"Price falls; the change in quantity is indeterminate","P?Q+":"Quantity rises; the change in price is indeterminate","P?Q-":"Quantity falls; the change in price is indeterminate"};
function dblCorrect(dD,dS){if(dD===dS)return dD>0?"P?Q+":"P?Q-";return dD>0?"P+Q?":"P-Q?"}
function dblExplain(dD,dS){
  const dp=dD>0?"pushes price up":"pushes price down",dq=dD>0?"pushes quantity up":"pushes quantity down";
  const sp=dS>0?"pushes price down":"pushes price up",sq=dS>0?"pushes quantity up":"pushes quantity down";
  const sure=dD===dS?"quantity":"price",unsure=dD===dS?"price":"quantity";
  return `Take each shift separately. The demand ${dD>0?"increase":"decrease"} ${dp} and ${dq}. The supply ${dS>0?"increase":"decrease"} ${sp} and ${sq}. Both push ${sure} the same way, so ${sure} definitely ${(dD===dS?(dD>0):(dD>0))?"rises":"falls"}. They push ${unsure} in opposite directions, so the net effect on ${unsure} depends on which shift is larger. Write 'indeterminate' for ${unsure}.`}
function genDbl(i,seed){
  const r=rng(seed);let m,e,dD,dS,stem;
  if(i>=DBL.length){const cb=[[1,1],[1,-1],[-1,1],[-1,-1]][i-DBL.length];[dD,dS]=cb;stem=`In a market, demand ${dD>0?"increases":"decreases"} and, at the same time, supply ${dS>0?"increases":"decreases"}. Which outcome is certain?`}
  else{[m,e,dD,dS]=DBL[i];stem=`In the market for <b>${esc(m)}</b>, ${esc(e)}. What happens to equilibrium price and quantity?`}
  const corr=dblCorrect(dD,dS);
  const trapSure=corr.includes("Q?")?["P"+corr[1]+"Q+","P"+corr[1]+"Q-"]:["P+Q"+corr[3],"P-Q"+corr[3]];
  const others=Object.keys(DOUT).filter(k=>k!==corr&&!trapSure.includes(k));
  const opts=shuffle([corr,...trapSure,pickN(others,1,r)[0]],r);
  const w=opts.map(k=>{if(k===corr)return null;
    if(!k.includes("?")){const ok=(k[1]===corr[1]&&corr[1]!=="?")||(k[3]===corr[3]&&corr[3]!=="?");
      return ok?"Half right. One variable is certain, but the other is pulled in opposite directions by the two shifts, so you cannot know it without the size of each shift.":"Neither part matches. Work through each shift on its own: "+dblExplain(dD,dS)}
    return "The certain and uncertain variables are swapped or the direction is wrong. "+dblExplain(dD,dS)});
  return {id:`g:dbl:${i}:${seed}`,t:"dbl",q:stem,o:opts.map(k=>DOUT[k]),a:opts.indexOf(corr),e:dblExplain(dD,dS)+" The diagram shows equal-sized shifts; try sketching one larger to see the uncertain variable change.",w,ge:mkt({D:[0,SH*dD],S:[0,SH*dS],title:m?"Market for "+m:""})};
}

const DKEYS=Object.keys(CAT).slice(0,7),SKEYS=Object.keys(CAT).slice(7);
function genDblDet(i,seed){
  const r=rng(seed),[m,e,dD,dS,kd,ks]=DBL[i];
  const lab=(x,y)=>`Demand: ${x.toLowerCase()} · Supply: ${y.toLowerCase()}`;
  const od=pickN(DKEYS.filter(x=>x!==kd),2,r),os=pickN(SKEYS.filter(x=>x!==ks),2,r);
  const pairs=shuffle([[kd,ks],[od[0],ks],[kd,os[0]],[od[1],os[1]]],r);
  const ci=pairs.findIndex(x=>x[0]===kd&&x[1]===ks);
  return {id:`g:dbldet:${i}:${seed}`,t:"dbl",q:`In the market for <b>${esc(m)}</b>, ${esc(e)}. Which non-price determinant causes each shift?`,
    o:pairs.map(x=>lab(x[0],x[1])),a:ci,
    e:`Demand ${dD>0?"increases":"decreases"} because of <b>${kd.toLowerCase()}</b> (${CAT[kd]}). Supply ${dS>0?"increases":"decreases"} because of <b>${ks.toLowerCase()}</b> (${CAT[ks]}).`,
    w:pairs.map(([x,y])=>x===kd&&y===ks?null:[x!==kd?`${x} means ${CAT[x]}, which is not what changes for buyers here.`:"",y!==ks?`${y} means ${CAT[y]}, which is not what changes for sellers here.`:""].filter(Boolean).join(" ")),
    ge:mkt({D:[0,SH*dD],S:[0,SH*dS],title:"Market for "+m})};
}

/* ---------- numeric disequilibrium ---------- */
function fmtS(c,d){return c===0?`Qs = ${d}P`:(c<0?`Qs = −${-c} + ${d}P`:`Qs = ${c} + ${d}P`)}
function uniq(correct,cands,r){const s=new Set([correct]);const out=[correct];for(const x of cands){if(out.length>=4)break;if(x>0&&!s.has(x)){s.add(x);out.push(x)}}let k=1;while(out.length<4){const x=correct+k*(r()<.5?-1:1)*(1+Math.floor(r()*3));if(x>0&&!s.has(x)){s.add(x);out.push(x)}k++}return shuffle(out,r)}
function genNum(seed){
  const r=rng(seed),sub=["eqP","eqQ","ceil","floor","nonbind"][seed%5];
  const P=4+Math.floor(r()*8),b=2+Math.floor(r()*5),d=2+Math.floor(r()*5),Qs=(4+Math.floor(r()*9))*10;
  const a=Qs+b*P,c=Qs-d*P,k=1+Math.floor(r()*3);
  const eqs=`Qd = ${a} − ${b}P and ${fmtS(c,d)}`;
  const solve=`Set Qd = Qs: ${a} − ${b}P = ${c<0?"−"+(-c):c} + ${d}P, so ${a-c} = ${b+d}P and P* = ${a-c}/${b+d} = ${P}. Then Q* = ${a} − ${b}(${P}) = ${Qs}.`;
  const id=`g:num:0:${seed}`;
  if(sub==="eqP"||sub==="eqQ"){
    const isP=sub==="eqP",corr=isP?P:Qs;
    const cands=isP?[P+1,P-1,b!==d?Math.round(Math.abs((a-c)/(b-d))):P+2,P+3]:[a,Qs+b,Qs-d*2,a-b*(P+1)];
    const opts=uniq(corr,cands,r);
    return {id,t:"calc",q:`A market has ${eqs}. What is the equilibrium ${isP?"price (P*)":"quantity (Q*)"}?`,o:opts.map(x=>(isP?"$":"")+x+(isP?"":" units")),a:opts.indexOf(corr),
      e:solve,w:opts.map(x=>x===corr?null:`Check by substituting: at equilibrium Qd must equal Qs. ${solve}`),ge:mkt({D:[0],S:[0]})};
  }
  if(sub==="ceil"||sub==="nonbind"){
    if(sub==="nonbind"){const pc=P+k;const opts=shuffle(["There is no shortage; the ceiling is above equilibrium so the market stays at P* and Q*",`A shortage of ${(b+d)*k} units`,`A surplus of ${(b+d)*k} units`,`The price falls to $${pc}`],r);
      const corr=opts.findIndex(x=>x.startsWith("There is no"));
      return {id,t:"calc",q:`A market has ${eqs}. The government sets a maximum price of $${pc}. What happens?`,o:opts,a:corr,
        e:`${solve} The maximum price ($${pc}) is above P* ($${P}). A ceiling only binds when it is below equilibrium, so the market price stays at $${P} and there is no shortage.`,
        w:opts.map((x,j)=>j===corr?null:`First find equilibrium: P* = $${P}. A ceiling of $${pc} is above it, so it does not restrict the market. ${j===opts.findIndex(y=>y.startsWith("A surplus"))?"Also, a maximum price can never cause a surplus.":""}`),ge:mkt({D:[0],S:[0]})}}
    const pc=P-k,qd=a-b*pc,qs=c+d*pc,sh=qd-qs;
    const opts=uniq(sh,[qd,qs,b*k,d*k,sh+10],r);
    return {id,t:"calc",q:`A market has ${eqs}. The government sets a maximum price of $${pc}. How large is the shortage?`,o:opts.map(x=>x+" units"),a:opts.indexOf(sh),
      e:`${solve} At $${pc}: Qd = ${a} − ${b}(${pc}) = ${qd} and Qs = ${c<0?"−"+(-c):c} + ${d}(${pc}) = ${qs}. Shortage = Qd − Qs = ${qd} − ${qs} = ${sh} units. Only ${qs} units are actually sold.`,
      w:opts.map(x=>x===sh?null:(x===qd?`${qd} is the quantity demanded at the ceiling, not the gap. Subtract quantity supplied (${qs}).`:x===qs?`${qs} is the quantity supplied (what is actually sold). The shortage is Qd minus Qs.`:`Calculate both quantities at $${pc}: Qd = ${qd}, Qs = ${qs}, so the shortage is ${sh}.`)),ge:mkt({D:[0],S:[0],ceil:3.9})};
  }
  const pf=P+k,qd=a-b*pf,qs=c+d*pf,sp=qs-qd;
  const opts=uniq(sp,[qs,qd,b*k,d*k,sp+10],r);
  return {id,t:"calc",q:`A market has ${eqs}. The government sets a minimum price of $${pf}. How large is the surplus?`,o:opts.map(x=>x+" units"),a:opts.indexOf(sp),
    e:`${solve} At $${pf}: Qd = ${a} − ${b}(${pf}) = ${qd} and Qs = ${c<0?"−"+(-c):c} + ${d}(${pf}) = ${qs}. Surplus = Qs − Qd = ${qs} − ${qd} = ${sp} units. Only ${qd} units are bought.`,
    w:opts.map(x=>x===sp?null:(x===qs?`${qs} is the quantity supplied at the floor, not the gap. Subtract quantity demanded (${qd}).`:x===qd?`${qd} is what consumers buy at the floor. The surplus is Qs minus Qd.`:`Calculate both quantities at $${pf}: Qs = ${qs}, Qd = ${qd}, so the surplus is ${sp}.`)),ge:mkt({D:[0],S:[0],floor:6.7})};
}

/* ---------- terms ---------- */
const TERMS=[
 ["Economics","The study of how societies allocate scarce resources to satisfy unlimited needs and wants.","Unit 1"],
 ["Scarcity","The condition where unlimited needs and wants exceed the limited resources available to meet them.","Unit 1"],
 ["Opportunity cost","The value of the next best alternative given up when a choice is made.","Unit 1"],
 ["Free good","A good with zero opportunity cost, such as air, because using it takes no scarce resources.","Unit 1"],
 ["Economic good","A good that uses scarce resources to produce, so it has an opportunity cost.","Unit 1"],
 ["Land","All natural resources used in production, such as soil, minerals, oil, fish and forests. Its reward is rent.","Unit 1"],
 ["Labour","Human physical and mental effort used in production. Its reward is wages.","Unit 1"],
 ["Capital","Man-made goods used to produce other goods and services, such as machines and buildings. Its reward is interest.","Unit 1"],
 ["Entrepreneurship","The organising of the other factors of production and the taking of risks. Its reward is profit.","Unit 1"],
 ["Microeconomics","The study of individual decision-makers: consumers, firms and single markets.","Unit 1"],
 ["Macroeconomics","The study of the economy as a whole: output, unemployment, inflation and growth.","Unit 1"],
 ["Free market economy","An economic system where households and firms make decisions through the price mechanism.","Unit 1"],
 ["Planned economy","An economic system where the government decides what, how and for whom to produce.","Unit 1"],
 ["Mixed economy","An economic system combining a private sector and a public sector.","Unit 1"],
 ["Public sector","The part of the economy owned or run by the government.","Unit 1"],
 ["Private sector","The part of the economy owned and run by individuals and firms.","Unit 1"],
 ["Production possibilities curve","A curve showing the maximum combinations of two goods an economy can produce with all resources fully and efficiently used.","Unit 1"],
 ["Actual growth","An increase in real output, shown as a movement from inside the PPC toward the curve.","Unit 1"],
 ["Growth in production possibilities","An increase in an economy's capacity to produce, shown as an outward shift of the PPC.","Unit 1"],
 ["Positive economics","Statements and analysis about what is, was or will be, which can be tested with evidence.","Unit 1"],
 ["Normative economics","Statements involving value judgements about what ought to be.","Unit 1"],
 ["Ceteris paribus","All other things being equal: holding every other variable constant.","Unit 1"],
 ["Laissez-faire","The view that government should interfere as little as possible in markets.","Unit 1"],
 ["Say's law","The classical idea that supply creates its own demand.","Unit 1"],
 ["Behavioural economics","A branch combining economics and psychology to explain choices that are not fully rational.","Unit 1"],
 ["Circular economy","A system that keeps resources in use through reuse, repair and recycling instead of take-make-dispose.","Unit 1"],
 ["Margin","The additional, or next, unit of something; decisions compare its extra benefit and extra cost.","Unit 1"],
 ["Utility","The satisfaction a consumer gains from consuming a good or service.","Unit 1"],
 ["Leakage","Income taken out of the circular flow: savings, taxes and imports.","Unit 1"],
 ["Injection","Spending added to the circular flow: investment, government spending and exports.","Unit 1"],
 ["Sustainability","Meeting present needs without compromising the ability of future generations to meet theirs.","Unit 1"],
 ["Equity","Fairness in the distribution of income, wealth or opportunity; a normative idea.","Unit 1"],
 ["Interdependence","The way economic decision-makers rely on and affect one another.","Unit 1"],
 ["Demand","The quantity of a good consumers are willing and able to buy at each price, over a period of time.","Unit 2"],
 ["Law of demand","As the price of a good rises, quantity demanded falls, ceteris paribus.","Unit 2"],
 ["Normal good","A good whose demand rises when income rises.","Unit 2"],
 ["Inferior good","A good whose demand falls when income rises.","Unit 2"],
 ["Substitutes","Goods that can be used in place of each other; a rise in one's price raises demand for the other.","Unit 2"],
 ["Complements","Goods used together; a rise in one's price lowers demand for the other.","Unit 2"],
 ["Supply","The quantity of a good firms are willing and able to produce and sell at each price, over a period of time.","Unit 2"],
 ["Law of supply","As the price of a good rises, quantity supplied rises, ceteris paribus.","Unit 2"],
 ["Joint supply","When producing one good automatically produces another, such as beef and leather.","Unit 2"],
 ["Competitive supply","When producing more of one good means producing less of another that uses the same resources.","Unit 2"],
 ["Indirect tax","A tax on spending on goods, paid to the government by producers; it shifts supply left.","Unit 2"],
 ["Subsidy","A payment by government to producers that lowers their costs and shifts supply right.","Unit 2"],
 ["Equilibrium","The price and quantity where quantity demanded equals quantity supplied.","Unit 2"],
 ["Excess demand","A shortage: quantity demanded is greater than quantity supplied at the current price.","Unit 2"],
 ["Excess supply","A surplus: quantity supplied is greater than quantity demanded at the current price.","Unit 2"],
 ["Price ceiling","A legal maximum price, set below equilibrium to have effect, which creates a shortage.","Unit 2"],
 ["Price floor","A legal minimum price, set above equilibrium to have effect, which creates a surplus.","Unit 2"],
 ["Signalling function","Price changes send information to buyers and sellers about changing market conditions.","Unit 2"],
 ["Incentive function","Price changes motivate producers and consumers to change their behaviour.","Unit 2"],
 ["Rationing function","Price allocates scarce goods to those willing and able to pay.","Unit 2"],
 ["Resource allocation","How factors of production are assigned among the production of different goods.","Unit 2"],
 ["Allocative efficiency","Producing the mix of goods society most wants, where welfare (social surplus) is maximised.","Unit 2"],
 ["Non-price determinant","Any factor other than the good's own price that changes demand or supply and so shifts the whole curve.","Unit 2"],
 ["Change in quantity demanded","A movement along the demand curve caused only by a change in the good's own price.","Unit 2"],
 ["Change in demand","A shift of the whole demand curve caused by a non-price determinant such as income or tastes.","Unit 2"],
 ["Change in quantity supplied","A movement along the supply curve caused only by a change in the good's own price.","Unit 2"],
 ["Change in supply","A shift of the whole supply curve caused by a non-price determinant such as input costs or technology.","Unit 2"],
 ["Extension","A movement along a demand or supply curve to a larger quantity, caused by a price change.","Unit 2"],
 ["Contraction","A movement along a demand or supply curve to a smaller quantity, caused by a price change.","Unit 2"],

 ["Market supply","The sum of all individual firms' quantities supplied at each price.","Unit 2"],

function genTerm(i,seed){
  const r=rng(seed),[t,d,u]=TERMS[i];const rev=seed%2===1;
  const pool=TERMS.map((x,j)=>j).filter(j=>j!==i&&TERMS[j][2]===u);
  const ds=pickN(pool,3,r),ord=shuffle([i,...ds],r);
  if(!rev) return {id:`g:term:${i}:${seed}`,t:"terms",q:`Which term matches this definition?<br><span class="muted" style="font-weight:500">${esc(d)}</span>`,o:ord.map(j=>TERMS[j][0]),a:ord.indexOf(i),
    e:`<b>${t}</b>: ${esc(d)}`,w:ord.map(j=>j===i?null:`${TERMS[j][0]} means: ${TERMS[j][1]}`)};
  return {id:`g:term:${i}:${seed}`,t:"terms",q:`Which is the correct definition of <b>${esc(t)}</b>?`,o:ord.map(j=>TERMS[j][1]),a:ord.indexOf(i),
    e:`<b>${t}</b>: ${esc(d)}`,w:ord.map(j=>j===i?null:`That defines ${TERMS[j][0].toLowerCase()}, not ${t.toLowerCase()}.`)};
}

/* ---------- build from id ---------- */
function build(id){
  const p=id.split(":");
  if(p[0]==="h"){const b=BANK[+p[1]];return {id,t:b.t,q:esc(b.q),o:b.o.map(esc),a:b.a,e:esc(b.e),w:b.w.map(x=>x&&esc(x)),g:b.g?fig(b.g):""}}
  const i=+p[2],s=+p[3];
  if(p[1]==="dbl")return genDbl(i,s);
  if(p[1]==="dbldet")return genDblDet(i,s);
  if(p[1]==="num")return genNum(s);
  if(p[1]==="term")return genTerm(i,s);
  const q=genShift(p[1],i,s);if(p[4]==="d"){q.t="ddet"}return q;
}
function newSeed(){return 1+Math.floor(R()*2e9)}
function genIds(topic,n){
  const out=[];
  for(let k=0;k<n;k++){
    const s=newSeed();
    if(topic==="shift"){const kinds=["curve","det","diag","pq","det","pq"];out.push(`g:${kinds[k%kinds.length]}:${Math.floor(R()*EV.length)}:${s}`)}
    else if(topic==="dbl")out.push(k%3===2?`g:dbldet:${Math.floor(R()*DBL.length)}:${s}`:`g:dbl:${Math.floor(R()*(DBL.length+4))}:${s}`);
    else if(topic==="calc")out.push(`g:num:0:${s-(s%5)+(k%5)}`);
    else if(topic==="terms")out.push(`g:term:${Math.floor(R()*TERMS.length)}:${s}`);
    else if(topic==="ddet"){const pool=EV.map((e,i)=>i).filter(i=>EV[i][2]==="D");out.push(`g:${["det","curve","pq","diag"][k%4]}:${pool[Math.floor(R()*pool.length)]}:${s}:d`)}
  }
  return shuffle(out);
}
function bankIds(topic){return shuffle(BANK.map((b,i)=>b.t===topic?"h:"+i:null).filter(Boolean))}
function buildPool(topics,n){
  const lists=topics.map(t=>TOPICS[t].gen?genIds(t,n):bankIds(t));
  const out=[];let k=0;
  while(out.length<n&&lists.some(l=>l.length)){const l=lists[k%lists.length];if(l.length)out.push(l.shift());k++}
  return shuffle(out);
}

/* ---------- session ---------- */
let S=null;
function startSession(ids,label){
  if(!ids.length)return;
  S={ids,i:0,label,res:[],cur:null,answered:false};
  location.hash="#practice";render();
}
function prepare(){const q=build(S.ids[S.i]);
  if(q.id.startsWith("h:")&&!q.diag){const ord=shuffle(q.o.map((_,j)=>j));q.o=ord.map(j=>q.o[j]);q.w=ord.map(j=>q.w[j]);q.a=ord.indexOf(q.a)}
  S.cur=q;S.answered=false;S.choice=null}
function renderQuiz(){
  if(!S.cur)prepare();const q=S.cur,n=S.ids.length;
  const opts=q.o.map((o,j)=>`<button class="opt" type="button" data-j="${j}" id="opt${j}"><span class="k">${LET[j]}</span><span style="min-width:0;flex:1">${o}</span></button>`).join("");
  $("#view").innerHTML=`
  <div class="qhead"><span class="qtag">${esc(S.label)} · ${S.i+1} of ${n}</span><div class="progress"><i style="width:${(S.i/n)*100}%"></i></div><button class="btn ghost small" id="quit" type="button">End session</button></div>
  <div class="card" style="display:flex;flex-direction:column;gap:18px">
    <span class="qtag">${TOPICS[q.t].u} · ${TOPICS[q.t].n}</span>
    <div class="qtext">${q.q}</div>
    ${q.g?`<div class="qfig">${q.g}</div>`:""}
    <div class="opts${q.diag?" diag":""}" id="opts">${opts}</div>
  </div>
  <div id="fb"></div>
  <div class="qfoot"><span class="small muted">Keys: <span class="kbd">A</span>–<span class="kbd">D</span> or <span class="kbd">1</span>–<span class="kbd">4</span> to answer, <span class="kbd">Enter</span> for next</span><button class="btn primary" id="next" type="button" disabled>Next question</button></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.j));
  $("#next").onclick=nextQ;$("#quit").onclick=finish;
}
function answer(j){
  if(S.answered)return;S.answered=true;S.choice=j;const q=S.cur,ok=j===q.a;
  S.res.push({id:q.id,ok,t:q.t,q:q.q});record(q,ok);
  document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("right");else if(k===j)b.classList.add("wrong");else b.classList.add("dim")});
  const all=q.o.map((o,k)=>`<li><b>${LET[k]}</b><span>${k===q.a?"Correct. ":""}${k===q.a?q.e:(q.w[k]||"Not the best answer.")}</span></li>`).join("");
  $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">
    <div class="verdict">${ok?"Correct":"Not quite. The answer is "+LET[q.a]}</div>
    ${!ok?`<div class="why"><h4>Why ${LET[j]} is wrong</h4><p>${q.w[j]||""}</p></div>`:""}
    <div class="why"><h4>Why ${LET[q.a]} is correct</h4><p>${q.e}</p></div>
    ${q.ge?`<div class="qfig">${q.ge}</div>`:""}
    <details class="all"><summary>Reasoning for every option</summary><ol>${all}</ol></details>
    ${ok?"":AskAI.box({subject:"IB Economics",question:q.q,options:q.o,correct:q.a,picked:j,explanation:(q.w[j]?q.w[j]+" ":"")+q.e})}
  </div>`;
  const nb=$("#next");nb.disabled=false;nb.textContent=S.i+1>=S.ids.length?"See results":"Next question";nb.focus();
}
function nextQ(){if(!S.answered)return;S.i++;if(S.i>=S.ids.length){finish();return}S.cur=null;renderQuiz();window.scrollTo({top:0})}
function finish(){
  const res=S.res,c=res.filter(x=>x.ok).length,n=res.length;const label=S.label;S=null;
  const by={};res.forEach(x=>{(by[x.t]=by[x.t]||{a:0,c:0}).a++;if(x.ok)by[x.t].c++});
  const miss=res.filter(x=>!x.ok);
  $("#view").innerHTML=`<div class="eyebrow">Session complete</div><h1>${esc(label)}</h1>
  <div class="card row" style="justify-content:space-between;gap:24px">
    <div><div class="score">${n?Math.round(c/n*100):0}%</div><div class="muted">${c} of ${n} correct</div></div>

function moveDiag(c){
  const W=380,H=290,L=54,Rt=W-22,T=18,B=H-42,X=q=>L+(q/10)*(Rt-L),Y=p=>B-(p/10)*(B-T);
  const ln=c==="D"?{a:9,b:-0.75}:{a:1.5,b:0.75},cls=c==="D"?"cd":"cs",col=c==="D"?"var(--dem)":"var(--sup)";
  const p1=c==="D"?6.75:3.75,p2=c==="D"?4.5:6,q=p=>(p-ln.a)/ln.b;
  let g=`<svg viewBox="0 0 ${W} ${H}" class="mkt" role="img" aria-label="Movement along the ${c==="D"?"demand":"supply"} curve"><defs><marker id="mv${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:${col}"/></marker></defs>`;
  g+=`<path class="ax" d="M${L} ${T-4}V${B}H${Rt+4}"/><text class="axl" x="${L-20}" y="${T+8}">P</text><text class="axl" x="${Rt-4}" y="${B+18}">Q</text>`;
  g+=`<line class="${cls}" x1="${X(0)}" y1="${Y(ln.a)}" x2="${X(10)}" y2="${Y(ln.a+10*ln.b)}"/>`;
  [[p1,"A","1"],[p2,"B","2"]].forEach(([p,n,k])=>{const x=X(q(p)),y=Y(p);g+=`<path class="guide" d="M${L} ${y}H${x}V${B}"/><circle class="dot" cx="${x}" cy="${y}" r="3.6"/><text class="pl" x="${x+8}" y="${y-6}">${n}</text><text class="tick" x="${L-6}" y="${y+4}" text-anchor="end">P${k}</text><text class="tick" x="${x}" y="${B+15}" text-anchor="middle">Q${k}</text>`});
  const a=0.35,qa=q(p1)+a,qb=q(p2)-a;
  g+=`<line x1="${X(qa)}" y1="${Y(ln.a+ln.b*qa)}" x2="${X(qb)}" y2="${Y(ln.a+ln.b*qb)}" stroke-width="1.8" style="stroke:${col}" marker-end="url(#mv${c})" transform="translate(10 10)"/>`;
  g+=`<text class="cl ${c==="D"?"d":"s"}" x="${Rt-6}" y="${c==="D"?Y(ln.a+ln.b*9.6)-6:Y(9.4)}" text-anchor="end">${c}</text>`;
  return g+"</svg>";
}

   <div class="callout">Never on this list: the good's own price (movement along the curve) and anything about producers, like input costs, technology, taxes or subsidies (those shift supply).</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px"><h2>Sort the event</h2>
   <p class="muted">Name the determinant and the direction, or spot the ones that aren't demand shifts at all.</p>
   <div class="card sorter" id="sorter"></div></div>
  <div class="row"><button class="btn primary" id="ddq" type="button">Demand determinant drill (20)</button><button class="btn" id="ddb" type="button">Written demand questions</button><a class="btn ghost" href="#ds">All of demand &amp; supply</a></div>`;
  if(!SRT)SRT={q:newSort(),pick:null,dir:null,done:false,n:1,c:0,t:0};
  drawSort();
  $("#ddq").onclick=()=>startSession(genIds("ddet",20),"Determinants of demand");
  $("#ddb").onclick=()=>startSession(bankIds("dem"),"Demand");
}

/* ---------- router ---------- */
const VIEWS={home:viewHome,ds:viewDS,demand:viewDemand,practice:viewPractice,markets:viewMarkets,worksheet:viewWorksheet,paper1:viewPaper1,terms:viewTerms};
function updateNav(){const v=(location.hash||"#home").slice(1);document.querySelectorAll(".nav a").forEach(a=>{a.classList.toggle("on",a.dataset.v===v)})}
function render(){const v=(location.hash||"#home").slice(1);(VIEWS[v]||viewHome)();updateNav()}
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(S&&v!=="practice")S=null;render();window.scrollTo({top:0})});
document.addEventListener("keydown",e=>{
  if(!S||!S.cur||e.target.tagName==="INPUT")return;
  const k=e.key.toUpperCase();let j=LET.indexOf(k);if(j<0&&/^[1-6]$/.test(k))j=+k-1;
  if(j>=0&&j<S.cur.o.length&&!S.answered){answer(j);e.preventDefault()}
  else if(e.key==="Enter"&&S.answered){nextQ();e.preventDefault()}
});
$("#themeBtn").onclick=()=>{const r=document.documentElement,cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");r.setAttribute("data-theme",cur==="dark"?"light":"dark")};
render();
</script>
