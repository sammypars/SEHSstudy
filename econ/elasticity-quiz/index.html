<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../../device.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elasticity Quiz · IB Econ</title>
<meta name="description" content="IB Economics elasticity review: PED, YED, XED and PES with worked examples, practice questions, calculation drills and practice tests.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"><link rel="icon" href="../../favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650;9..144,800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Same design system as the SEHS Study hub and the other econ site: Fraunces / Source Sans 3 / IBM Plex Mono, warm neutral paper, econ blue accent */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --sunk:#ECEBE5; --ink:#1B1C1E; --muted:#62656B; --line:#E1E0DA;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#E8EDFB;
  --dem:#1F4FD1; --sup:#C2410C;
  --good:#1E7041; --good-soft:#E2F2E7; --bad:#B42318; --bad-soft:#FBE8E5; --warn:#9A6700;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121315; --surface:#1B1C1F; --sunk:#25262A; --ink:#ECEBE7; --muted:#A3A5AA; --line:#2E3034;
  --accent:#7C9BFF; --accent-ink:#121315; --accent-soft:#1D2540; --dem:#7C9BFF; --sup:#F08A4B;
  --good:#5CCB8A; --good-soft:#15291D; --bad:#F2867A; --bad-soft:#331A17; --warn:#E3B341; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1B1C1F; --sunk:#25262A; --ink:#ECEBE7; --muted:#A3A5AA; --line:#2E3034;
  --accent:#7C9BFF; --accent-ink:#121315; --accent-soft:#1D2540; --dem:#7C9BFF; --sup:#F08A4B;
  --good:#5CCB8A; --good-soft:#15291D; --bad:#F2867A; --bad-soft:#331A17; --warn:#E3B341; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em;font-weight:650}
h1{font-size:clamp(28px,4.2vw,42px);font-weight:800}
h2{font-size:23px} h3{font-size:18px}
p{margin:0}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.railhome{padding:0 10px 14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;padding:0 10px 4px;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;font-weight:400;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.navgroup{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 10px 4px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav .count{font-family:var(--f-mono);font-size:11px;background:var(--bad-soft);color:var(--bad);border-radius:20px;padding:1px 7px}
.rail-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--muted)}
.main{padding-block:36px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.lede{color:var(--muted);max-width:64ch;font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
.mono{font-family:var(--f-mono)} .muted{color:var(--muted)} .small{font-size:13px}
.up{color:var(--good);font-weight:600} .dn{color:var(--bad);font-weight:600}

/* dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.test-card{background:#17337F;color:#fff;border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px}
.test-card .eyebrow{color:inherit;opacity:.75}
:root[data-theme="dark"] .test-card{background:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .test-card{background:var(--accent);color:var(--accent-ink)}}
.test-card ul{margin:0;padding-left:18px;font-size:14px;opacity:.9}
.test-card .btn{background:var(--surface);color:var(--ink);border-color:var(--surface);align-self:flex-start}
.topic{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left}
.topic:hover{border-color:var(--accent)}
.topic .u{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.topic .n{font-weight:650;font-size:15px}
.bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.topic .s{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.link-card{display:flex;flex-direction:column;gap:4px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.link-card:hover{border-color:var(--accent)}
.link-card b{font-weight:650} .link-card span{font-size:13.5px;color:var(--muted)}
.link-card .u{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* setup + quiz */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:30px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:650}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer;font-family:var(--f-mono);font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.label{font-weight:650;font-size:14px;margin-bottom:8px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.progress{flex:1;min-width:140px;height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtag{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.qtext{font-size:20px;font-weight:600;line-height:1.45;max-width:68ch}
.qfig{display:flex;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:13px 15px;cursor:pointer;font-size:16px;line-height:1.45;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--bg)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
label.opt{position:relative}
label.opt input{position:absolute;opacity:0;pointer-events:none}
label.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
label.opt.locked{cursor:default}
.feedback{border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);background:var(--surface)}
.feedback.ok{border-left:4px solid var(--good)} .feedback.no{border-left:4px solid var(--bad)}
.verdict{font-family:var(--f-display);font-weight:700;font-size:20px}
.feedback.ok .verdict,.verdict.good{color:var(--good)} .feedback.no .verdict,.verdict.bad{color:var(--bad)}
.why h4{margin:0 0 4px;font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.why p{max-width:70ch}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* problems and fields */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--muted);font-weight:600}
select,input[type=number],input[type=text],textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical;line-height:1.5}
select:hover,input:hover,textarea:hover{border-color:var(--muted)}
.right{border-color:var(--good)!important;background:var(--good-soft)!important}
.wrongf{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.prob{display:flex;flex-direction:column;gap:14px}
.prob .num{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prob .prompt{font-weight:600;font-size:17px;line-height:1.45;max-width:70ch}
.expl{font-size:15.5px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.expl.good{border-left-color:var(--good)} .expl.bad{border-left-color:var(--bad)}
.ctx{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 8px 8px 0;font-size:15px}
.pts{display:flex;flex-direction:column;gap:6px}
.pts label{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.pts input{margin-top:5px;accent-color:var(--accent)}
.sticky-score{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.chipx{font-family:var(--f-mono);font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted)}

/* notes */
.prose{display:flex;flex-direction:column;gap:12px;max-width:none}
.prose ul,.prose ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.prose p{max-width:70ch}
.formula{font-family:var(--f-mono);font-size:15.5px;background:var(--sunk);border-radius:8px;padding:12px 14px;overflow-x:auto}
.formula span{color:var(--accent);font-weight:600}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
.table th{background:var(--sunk);font-weight:650;font-size:13px}
.tablewrap{overflow-x:auto}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 8px 8px 0;font-size:14.5px}
.ex{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);background:var(--surface);padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.ex .exh{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ex p{max-width:70ch}
.nfig{margin:0;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.nfig figcaption{font-size:13px;color:var(--muted);text-align:center}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.term{border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.term p{font-size:14px;color:var(--muted)}
.score{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.missed{display:flex;flex-direction:column;gap:8px}
.missed div{border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px;background:var(--surface)}
.themebtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--muted)}

/* svg diagrams */
svg.mkt{width:100%;max-width:440px;height:auto;display:block;margin:0 auto;font-family:var(--f-mono)}
.ax{stroke:var(--ink);stroke-width:1.6;fill:none}
.axl{fill:var(--ink);font-size:12px;font-weight:600}
.tick{fill:var(--muted);font-size:10.5px}
.cd{stroke:var(--dem);stroke-width:2.6;fill:none}
.cs{stroke:var(--sup);stroke-width:2.6;fill:none}
.base{opacity:.38}
.cl{font-size:11.5px;font-weight:600}
.cl.d{fill:var(--dem)} .cl.s{fill:var(--sup)}
.guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;fill:none}
.dot{fill:var(--ink)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px max(12px,env(safe-area-inset-left,0px));z-index:5;gap:2px;border-right:0;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand small,.navgroup,.rail-foot{display:none}
  .railhome{padding:0 8px 0 0!important;flex:none}
  .brand{padding:0 8px 0 2px;white-space:nowrap;font-size:16px}
  .nav{display:flex;gap:2px}
  .nav a{white-space:nowrap;padding:7px 10px;font-size:13.5px}
  .hero,.grid3{grid-template-columns:1fr}
  .main{padding-block:22px 60px}
}
@media (max-width:560px){
  .grid2,.terms{grid-template-columns:1fr}
  .qtext{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="railhome"><a data-home class="compact"></a></div>
    <div class="brand">Elasticity<small>IB Economics · PED YED XED PES</small></div>
    <div class="nav" id="nav"></div>
    <div class="rail-foot">Progress saves in this browser.<br><button class="themebtn" id="themeBtn" type="button">Switch theme</button></div>
  </nav>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>

<script src="../../ask-ai.js"></script>
<script src="../../home.js"></script>
<script src="diagrams.js"></script>
<script src="questions.js"></script>
<script src="questions2.js"></script>
<script src="problems.js"></script>
<script src="worksheets.js"></script>
<script src="notes.js"></script>
<script src="app.js"></script>
<script src="app-work.js"></script>
<script>start();</script>
</body>
</html>
